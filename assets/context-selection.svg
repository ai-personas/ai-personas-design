    <text x="112" y="1000" font-size="23" fill="#00665f" font-weight="700"><tspan x="112" dy="0">Choose context for the next</tspan><tspan x="112" dy="32">call</tspan></text>
    <text x="50" y="1117" font-size="22" fill="#16332f"><tspan x="50" dy="0">Choose fragments and supporting</tspan><tspan x="50" dy="31">resources. Preserve, replace, clear or</tspan><tspan x="50" dy="31">state an allowed blocked outcome;</tspan><tspan x="50" dy="31">omission is invalid.</tspan></text>
    <path d="M260 1250 Q292 1254 280 1273" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M273 1266 L280 1275 L288 1266" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M29 1287 L529 1285 L531 1567 L27 1570 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="1295" width="486" height="116" rx="16" fill="#f8e8ec" stroke="none" stroke-width="0"/>
    <ellipse cx="486" cy="1319" rx="20" ry="21" fill="#b9dce5" stroke="#00665f" stroke-width="2"/>
    <ellipse cx="480" cy="1316" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="493" cy="1316" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M481 1327 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="49" y="1327" font-size="23" fill="#00665f" font-weight="700"><tspan x="49" dy="0">Required state + selected</tspan><tspan x="49" dy="32">text</tspan></text>
    <text x="50" y="1444" font-size="22" fill="#16332f"><tspan x="50" dy="0">Supply current character, authority and</tspan><tspan x="50" dy="31">relevant work state, plus exact selected</tspan><tspan x="50" dy="31">text and complete qualifications.</tspan><tspan x="50" dy="31">Exposed tools need usable definitions.</tspan></text>
    <path d="M260 1577 Q292 1581 280 1600" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M273 1593 L280 1602 L288 1593" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M29 1614 L529 1612 L531 1894 L27 1897 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="1622" width="486" height="116" rx="16" fill="#e5f4ed" stroke="none" stroke-width="0"/>
    <ellipse cx="76" cy="1646" rx="20" ry="21" fill="#f5d9ae" stroke="#245599" stroke-width="2"/>
    <ellipse cx="70" cy="1643" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="83" cy="1643" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M71 1654 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="112" y="1654" font-size="23" fill="#245599" font-weight="700"><tspan x="112" dy="0">The actual next model</tspan><tspan x="112" dy="32">request</tspan></text>
    <text x="50" y="1771" font-size="22" fill="#16332f"><tspan x="50" dy="0">Record what was actually sent: message</tspan><tspan x="50" dy="31">roles, text, tool definitions, omissions</tspan><tspan x="50" dy="31">and retained context. A stored reference</tspan><tspan x="50" dy="31">is not supplied content.</tspan></text>
    <path d="M29 1919 L531 1917 L527 2030 L32 2028 Z" stroke="#885000" stroke-width="1.5" fill="#fff0cd" stroke-linecap="round" stroke-linejoin="round" />
    <text x="46" y="1947" font-size="20" fill="#16332f"><tspan x="46" dy="0">A preview or read may influence its receiving</tspan><tspan x="46" dy="29">call without becoming a persistent selection.</tspan><tspan x="46" dy="29">“Unselected” does not mean “unseen.”</tspan></text>
    <text x="30" y="2065" font-size="19" fill="#405d58"><tspan x="30" dy="0">Characters personify design choices; they do not</tspan><tspan x="30" dy="28">assert feelings or consciousness. Scenes are</tspan><tspan x="30" dy="28">hypothetical.</tspan></text>
  </g>
</svg>
