    <ellipse cx="138" cy="645" rx="2.5" ry="3.5" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="154" cy="645" rx="2.5" ry="3.5" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M137 657 q10 8 20 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="43" y="710" font-size="22" fill="#00665f" font-weight="700"><tspan x="43" dy="0">Known exact</tspan><tspan x="43" dy="31">item</tspan></text>
    <text x="43" y="784" font-size="21" fill="#16332f"><tspan x="43" dy="0">Use a currently</tspan><tspan x="43" dy="30">eligible exact</tspan><tspan x="43" dy="30">reference without a</tspan><tspan x="43" dy="30">new search.</tspan></text>
    <path d="M291 611 l239 2 l1 302 l-241 1 Z" stroke="#245599" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="409" cy="648" rx="25" ry="26" fill="#b9dce5" stroke="#245599" stroke-width="2"/>
    <ellipse cx="401" cy="645" rx="2.5" ry="3.5" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="417" cy="645" rx="2.5" ry="3.5" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M400 657 q10 8 20 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="306" y="710" font-size="22" fill="#245599" font-weight="700"><tspan x="306" dy="0">Unknown item</tspan></text>
    <text x="306" y="753" font-size="21" fill="#16332f"><tspan x="306" dy="0">The primary LLM</tspan><tspan x="306" dy="30">requests bounded</tspan><tspan x="306" dy="30">listing, search,</tspan><tspan x="306" dy="30">preview or reading.</tspan></text>
