<svg xmlns="http://www.w3.org/2000/svg" width="560" height="2156" viewBox="0 0 560 2156" role="img" aria-labelledby="title description">
  <title id="title">From a file choice to actual context</title>
  <desc id="description">Known exact references and bounded primary-chosen discovery lead to explicit next-context selection. Mandatory state and eligible selected bodies form the actual provider attempt, with separate exposure evidence. Expressive cartoon characters and concrete artifacts illustrate the mechanism; this is a hypothetical teaching scene.</desc>
