    <text x="47" y="535" font-size="22" fill="#ffffff" font-weight="700"><tspan x="47" dy="0">The bulk catalogue stays outside the</tspan><tspan x="47" dy="31">request</tspan></text>
    <path d="M28 611 l239 2 l1 302 l-241 1 Z" stroke="#00665f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
