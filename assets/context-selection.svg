    <ellipse cx="76" cy="992" rx="20" ry="21" fill="#f5d9ae" stroke="#00665f" stroke-width="2"/>
    <ellipse cx="70" cy="989" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
