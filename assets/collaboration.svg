<svg xmlns="http://www.w3.org/2000/svg" width="560" height="2123" viewBox="0 0 560 2123" role="img" aria-labelledby="title description">
  <title id="title">Cooperate without inventing commitment</title>
  <desc id="description">Human and persona needs can lead to direct contributions or accepted continuing roles. Disagreement, decision rights and actual handoff acceptance remain explicit, without compulsory teams or leaders. Expressive cartoon characters and concrete artifacts illustrate the mechanism; this is a hypothetical teaching scene.</desc>
  <rect width="560" height="2123" fill="#fffaf0"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="28" y="55" font-size="27" fill="#16332f" font-weight="700"><tspan x="28" dy="0">Cooperate without inventing</tspan><tspan x="28" dy="36">commitment</tspan></text>
    <text x="28" y="129" font-size="17" fill="#00665f" font-weight="700"><tspan x="28" dy="0">AN ILLUSTRATED DESIGN STORY</tspan></text>
    <rect x="20" y="153" width="520" height="330" rx="20" fill="#fff0cd" stroke="#d0d5cb" stroke-width="1"/>
    <rect x="35" y="169" width="212" height="57" rx="20" fill="#ffffff" stroke="#00665f" stroke-width="3"/>
    <path d="M60 224 L63 246 L85 224" stroke="#00665f" stroke-width="3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <text x="50" y="202" font-size="23" fill="#00665f" font-weight="700"><tspan x="50" dy="0">Can I help?</tspan></text>
    <rect x="267" y="169" width="257" height="85" rx="20" fill="#ffffff" stroke="#245599" stroke-width="3"/>
    <path d="M479 252 L482 274 L504 252" stroke="#245599" stroke-width="3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <text x="282" y="200" font-size="21" fill="#245599" font-weight="700"><tspan x="282" dy="0">I accept this</tspan><tspan x="282" dy="30">scope.</tspan></text>
    <g transform="translate(110 370) scale(1)">
      <ellipse cx="0" cy="74" rx="47" ry="7" fill="#d8dfd5" stroke="none" stroke-width="3"/>
      <path d="M-30 63 Q-31 15 0 13 Q31 15 30 63 Z" stroke="#16332f" stroke-width="3" fill="#00665f" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-13 61 L-16 76 M13 61 L18 76" stroke="#16332f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-24 30 Q-45 41 -54 24 M24 30 Q44 25 50 9" stroke="#16332f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <ellipse cx="0" cy="-10" rx="32" ry="35" fill="#b9dce5" stroke="#16332f" stroke-width="3"/>
      <path d="M-29 -25 Q-2 -57 30 -23 L17 -28 L8 -37 L-6 -27 Z" stroke="#16332f" stroke-width="3" fill="#00665f" stroke-linecap="round" stroke-linejoin="round" />
      <ellipse cx="-10" cy="-12" rx="3" ry="4" fill="#16332f" stroke="none" stroke-width="3"/>
      <ellipse cx="11" cy="-12" rx="3" ry="4" fill="#16332f" stroke="none" stroke-width="3"/>
      <path d="M-17 -23 L-7 -26 M6 -25 L17 -20" stroke="#16332f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-7 8 Q1 2 9 8" stroke="#16332f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <g transform="translate(443 370) scale(1)">
      <ellipse cx="0" cy="74" rx="47" ry="7" fill="#d8dfd5" stroke="none" stroke-width="3"/>
      <path d="M-30 63 Q-31 15 0 13 Q31 15 30 63 Z" stroke="#16332f" stroke-width="3" fill="#245599" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-13 61 L-16 76 M13 61 L18 76" stroke="#16332f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-24 30 Q-45 41 -54 24 M24 30 Q44 25 50 9" stroke="#16332f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <ellipse cx="0" cy="-10" rx="32" ry="35" fill="#f5d9ae" stroke="#16332f" stroke-width="3"/>
      <path d="M-30 -20 L-22 -43 L0 -38 L23 -44 L31 -17" stroke="#16332f" stroke-width="3" fill="#245599" stroke-linecap="round" stroke-linejoin="round" />
      <ellipse cx="-10" cy="-12" rx="3" ry="4" fill="#16332f" stroke="none" stroke-width="3"/>
      <ellipse cx="11" cy="-12" rx="3" ry="4" fill="#16332f" stroke="none" stroke-width="3"/>
      <path d="M-10 5 Q0 18 13 4" stroke="#16332f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <path d="M245 325 L302 325 L316 339 L314 418 L241 415 Z" stroke="#885000" stroke-width="3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M302 325 V340 H316" stroke="#885000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M253 350 H304" stroke="#885000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M253 362 H304" stroke="#885000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M253 374 H304" stroke="#885000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="227" y="445" font-size="19" fill="#885000" font-weight="700"><tspan x="227" dy="0">Agreed</tspan><tspan x="227" dy="28">role</tspan></text>
    <path d="M28 505 L529 503 L525 589 L32 587 Z" stroke="#00665f" stroke-width="2" fill="#00665f" stroke-linecap="round" stroke-linejoin="round" />
    <text x="47" y="535" font-size="22" fill="#ffffff" font-weight="700"><tspan x="47" dy="0">A need can come from a human or a</tspan><tspan x="47" dy="31">persona</tspan></text>
    <path d="M28 611 l239 2 l1 332 l-241 1 Z" stroke="#00665f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="146" cy="648" rx="25" ry="26" fill="#f5d9ae" stroke="#00665f" stroke-width="2"/>
    <ellipse cx="138" cy="645" rx="2.5" ry="3.5" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="154" cy="645" rx="2.5" ry="3.5" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M137 657 q10 8 20 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="43" y="710" font-size="22" fill="#00665f" font-weight="700"><tspan x="43" dy="0">A direct</tspan><tspan x="43" dy="31">contribution</tspan></text>
    <text x="43" y="784" font-size="21" fill="#16332f"><tspan x="43" dy="0">Offer an idea,</tspan><tspan x="43" dy="30">answer or useful</tspan><tspan x="43" dy="30">assessment</tspan><tspan x="43" dy="30">without inventing a</tspan><tspan x="43" dy="30">continuing role.</tspan></text>
    <path d="M291 611 l239 2 l1 332 l-241 1 Z" stroke="#245599" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <ellipse cx="409" cy="648" rx="25" ry="26" fill="#b9dce5" stroke="#245599" stroke-width="2"/>
    <ellipse cx="401" cy="645" rx="2.5" ry="3.5" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="417" cy="645" rx="2.5" ry="3.5" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M400 657 q10 8 20 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="306" y="710" font-size="22" fill="#245599" font-weight="700"><tspan x="306" dy="0">Continuing</tspan><tspan x="306" dy="31">responsibility</tspan></text>
    <text x="306" y="784" font-size="21" fill="#16332f"><tspan x="306" dy="0">Accept current</tspan><tspan x="306" dy="30">scope and terms</tspan><tspan x="306" dy="30">before being</tspan><tspan x="306" dy="30">counted as an</tspan><tspan x="306" dy="30">owner or reviewer.</tspan></text>
    <path d="M29 970 L529 968 L531 1218 L27 1221 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="978" width="486" height="84" rx="16" fill="#fff0cd" stroke="none" stroke-width="0"/>
    <ellipse cx="76" cy="1002" rx="20" ry="21" fill="#f5d9ae" stroke="#00665f" stroke-width="2"/>
    <ellipse cx="70" cy="999" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="83" cy="999" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M71 1010 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="112" y="1010" font-size="23" fill="#00665f" font-weight="700"><tspan x="112" dy="0">Work together when useful</tspan></text>
    <text x="50" y="1095" font-size="22" fill="#16332f"><tspan x="50" dy="0">Participants may share a task, explore</tspan><tspan x="50" dy="31">an authorized question or develop a</tspan><tspan x="50" dy="31">relationship. A team or leader is not</tspan><tspan x="50" dy="31">required for every need.</tspan></text>
    <path d="M29 1245 L529 1243 L531 1525 L27 1528 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="1253" width="486" height="116" rx="16" fill="#f8e8ec" stroke="none" stroke-width="0"/>
    <ellipse cx="486" cy="1277" rx="20" ry="21" fill="#b9dce5" stroke="#885000" stroke-width="2"/>
    <ellipse cx="480" cy="1274" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="493" cy="1274" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M481 1285 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="49" y="1285" font-size="23" fill="#885000" font-weight="700"><tspan x="49" dy="0">Disagreement stays</tspan><tspan x="49" dy="32">attributable</tspan></text>
    <text x="50" y="1402" font-size="22" fill="#16332f"><tspan x="50" dy="0">Explain differing evidence, assumptions</tspan><tspan x="50" dy="31">and judgments. Use the decision rights</tspan><tspan x="50" dy="31">adopted for this work; silence or</tspan><tspan x="50" dy="31">enthusiasm is not acceptance.</tspan></text>
    <path d="M29 1552 L529 1550 L531 1832 L27 1835 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="1560" width="486" height="116" rx="16" fill="#e5f4ed" stroke="none" stroke-width="0"/>
    <ellipse cx="76" cy="1584" rx="20" ry="21" fill="#f5d9ae" stroke="#00665f" stroke-width="2"/>
    <ellipse cx="70" cy="1581" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="83" cy="1581" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M71 1592 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="112" y="1592" font-size="23" fill="#00665f" font-weight="700"><tspan x="112" dy="0">A handoff needs a real</tspan><tspan x="112" dy="32">receiver</tspan></text>
    <text x="50" y="1709" font-size="22" fill="#16332f"><tspan x="50" dy="0">An accepted transfer preserves</tspan><tspan x="50" dy="31">obligations, resources and unresolved</tspan><tspan x="50" dy="31">issues. Naming another persona cannot</tspan><tspan x="50" dy="31">discharge responsibility.</tspan></text>
    <path d="M29 1857 L531 1855 L527 1997 L32 1995 Z" stroke="#885000" stroke-width="1.5" fill="#fff0cd" stroke-linecap="round" stroke-linejoin="round" />
    <text x="46" y="1885" font-size="20" fill="#16332f"><tspan x="46" dy="0">Task-free exploration still needs its actual</tspan><tspan x="46" dy="29">authority and finite bounds. Conversation</tspan><tspan x="46" dy="29">does not create an unfunded background</tspan><tspan x="46" dy="29">loop.</tspan></text>
    <text x="30" y="2032" font-size="19" fill="#405d58"><tspan x="30" dy="0">Characters personify design choices; they do not</tspan><tspan x="30" dy="28">assert feelings or consciousness. Scenes are</tspan><tspan x="30" dy="28">hypothetical.</tspan></text>
  </g>
</svg>
