<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">A few collaborators, chosen for this situation</title><desc id="desc">Ten personas are available. Three voluntarily participate in one example; the other seven remain outside this work. Invitations, acceptance and contributions are separate. Coordination can change and no permanent manager is required.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20334b}.title{font-size:46px;font-weight:700}.subtitle{font-size:25px;fill:#536477}.heading{font-size:28px;font-weight:700}.body{font-size:24px}.edge{font-size:21px;fill:#536477}.note{font-size:25px;font-weight:700}.small{font-size:21px;fill:#536477}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="#63758a"/></marker></defs><rect width="1600" height="1000" fill="#ffffff"/><rect x="64" y="48" width="72" height="7" rx="3" fill="#236e60"/>
<text x="64" y="113" class="title"><tspan x="64" dy="0">A few collaborators, chosen for this situation</tspan></text>
<text x="64" y="158" class="subtitle"><tspan x="64" dy="0">Ten available personas do not mean ten participants—or a fixed three-person team.</tspan></text>
<rect x="64" y="230" width="448" height="210" rx="18" fill="#eee9ff" stroke="#6551a5" stroke-width="2"/>
<circle cx="98" cy="266" r="19" fill="#6551a5"/>
<text x="98" y="274" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">A</text>
<text x="130" y="275" class="heading"><tspan x="130" dy="0">Persona A</tspan></text>
<text x="88" y="324" class="body"><tspan x="88" dy="0">Receives the need; chooses</tspan><tspan x="88" dy="32">whether useful help is needed.</tspan></text>
<rect x="576" y="230" width="448" height="210" rx="18" fill="#e8f0ff" stroke="#315d94" stroke-width="2"/>
<circle cx="610" cy="266" r="19" fill="#315d94"/>
<text x="610" y="274" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">B</text>
<text x="642" y="275" class="heading"><tspan x="642" dy="0">Persona B</tspan></text>
<text x="600" y="324" class="body"><tspan x="600" dy="0">Chooses to accept a specific</tspan><tspan x="600" dy="32">contribution or asks for</tspan><tspan x="600" dy="32">clarity.</tspan></text>
<rect x="1088" y="230" width="448" height="210" rx="18" fill="#e3f3ef" stroke="#236e60" stroke-width="2"/>
<circle cx="1122" cy="266" r="19" fill="#236e60"/>
<text x="1122" y="274" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">C</text>
<text x="1154" y="275" class="heading"><tspan x="1154" dy="0">Persona C</tspan></text>
<text x="1112" y="324" class="body"><tspan x="1112" dy="0">Chooses a contribution; may</tspan><tspan x="1112" dy="32">question, revise or withdraw.</tspan></text>
<path d="M512 320 H576" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M576 365 H512" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1024 320 H1088" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1088 365 H1024" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="64" y="500" class="note"><tspan x="64" dy="0">Invitation ≠ acceptance ≠ contribution ≠ useful result</tspan></text>
<rect x="64" y="550" width="1472" height="214" rx="18" fill="#f2f5f8"/>
<text x="90" y="593" class="heading"><tspan x="90" dy="0">Other available personas · no invitation or participation assumed</tspan></text>
<circle cx="157" cy="665" r="34" fill="#dfe6ef" stroke="#63758a" stroke-width="2"/><text x="157" y="675" text-anchor="middle" class="heading">D</text>
<circle cx="359" cy="665" r="34" fill="#dfe6ef" stroke="#63758a" stroke-width="2"/><text x="359" y="675" text-anchor="middle" class="heading">E</text>
<circle cx="561" cy="665" r="34" fill="#dfe6ef" stroke="#63758a" stroke-width="2"/><text x="561" y="675" text-anchor="middle" class="heading">F</text>
<circle cx="763" cy="665" r="34" fill="#dfe6ef" stroke="#63758a" stroke-width="2"/><text x="763" y="675" text-anchor="middle" class="heading">G</text>
<circle cx="965" cy="665" r="34" fill="#dfe6ef" stroke="#63758a" stroke-width="2"/><text x="965" y="675" text-anchor="middle" class="heading">H</text>
<circle cx="1167" cy="665" r="34" fill="#dfe6ef" stroke="#63758a" stroke-width="2"/><text x="1167" y="675" text-anchor="middle" class="heading">I</text>
<circle cx="1369" cy="665" r="34" fill="#dfe6ef" stroke="#63758a" stroke-width="2"/><text x="1369" y="675" text-anchor="middle" class="heading">J</text>
<text x="90" y="736" class="body"><tspan x="90" dy="0">Each retains its own model, activity, relationships and choices.</tspan></text>
<rect x="64" y="844" width="1472" height="79" rx="16" fill="#f2f5f8"/>
<text x="90" y="877" class="note"><tspan x="90" dy="0">This is an example, not a group-size limit. A simple task can be completed by one persona.</tspan></text>
<text x="64" y="962" class="small"><tspan x="64" dy="0">Conceptual design • Arrows show possible transitions, not demonstrated improvement.</tspan></text>
</svg>
