<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Each persona owns its character</title><desc id="desc">Three continuing identities each own a different numerical model, invoke reasoning with their own state and choose actions. Shared skills and facts are supporting resources. One persona cannot silently adopt another persona’s weights or commitments.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20334b}.title{font-size:46px;font-weight:700}.subtitle{font-size:25px;fill:#536477}.heading{font-size:28px;font-weight:700}.body{font-size:24px}.edge{font-size:21px;fill:#536477}.note{font-size:25px;font-weight:700}.small{font-size:21px;fill:#536477}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="#63758a"/></marker></defs><rect width="1600" height="1000" fill="#ffffff"/><rect x="64" y="48" width="72" height="7" rx="3" fill="#236e60"/>
<text x="64" y="113" class="title"><tspan x="64" dy="0">Each persona owns its character</tspan></text>
<text x="64" y="158" class="subtitle"><tspan x="64" dy="0">A reasoning service can be shared; personal weights and development remain separate.</tspan></text>
<rect x="64" y="230" width="448" height="210" rx="18" fill="#eee9ff" stroke="#6551a5" stroke-width="2"/>
<circle cx="98" cy="266" r="19" fill="#6551a5"/>
