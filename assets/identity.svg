<text x="130" y="275" class="heading"><tspan x="130" dy="0">Persona A · own model</tspan></text>
<text x="88" y="324" class="body"><tspan x="88" dy="0">Own parameters, model lineage,</tspan><tspan x="88" dy="32">experience and accepted duties.</tspan></text>
<rect x="64" y="560" width="448" height="210" rx="18" fill="#eee9ff" stroke="#6551a5" stroke-width="2"/>
<circle cx="98" cy="596" r="19" fill="#6551a5"/>
<text x="98" y="604" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">→</text>
<text x="130" y="605" class="heading"><tspan x="130" dy="0">Own decision</tspan></text>
<text x="88" y="654" class="body"><tspan x="88" dy="0">Its model outputs and selected</tspan><tspan x="88" dy="32">resources inform its reasoning</tspan><tspan x="88" dy="32">call.</tspan></text>
