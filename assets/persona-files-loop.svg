    <text x="102" y="493" font-size="21">Openness · Conscientiousness</text>
    <text x="102" y="525" font-size="21">Extraversion · Agreeableness</text>
    <text x="102" y="557" font-size="21">Neuroticism / Negative Emotionality</text>
