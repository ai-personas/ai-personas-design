    <text x="306" y="674" font-size="22" fill="#245599" font-weight="700"><tspan x="306" dy="0">Supporting</tspan><tspan x="306" dy="31">assets</tspan></text>
    <text x="306" y="748" font-size="21" fill="#16332f"><tspan x="306" dy="0">Knowledge, tools,</tspan><tspan x="306" dy="30">skills, data and</tspan><tspan x="306" dy="30">attributed history.</tspan></text>
