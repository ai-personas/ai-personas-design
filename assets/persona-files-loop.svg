    <text x="670" y="525" font-size="21">Dominance / perceived control</text>
    <text x="670" y="557" font-size="21">Baseline and current state stay distinct</text>
    <text x="102" y="583" font-size="17" fill="#514c61">Profile and own-voice account agree; qualitative descriptions suffice.</text>

