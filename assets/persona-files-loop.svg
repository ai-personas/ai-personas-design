    <text x="339" y="647" font-size="23" fill="#5d4d74">Shapes own-voice fragments</text>
    <text x="936" y="632" font-size="23" fill="#5d4d74">Shapes discretionary choices</text>
    <text x="936" y="666" font-size="20" fill="#5d4d74">Work · communication · cooperation · navigation</text>

    <rect x="72" y="690" width="480" height="394" rx="20" fill="#e8eee9" stroke="#a5b9ac" stroke-width="2"/>
    <text x="102" y="732" font-size="18" font-weight="700" letter-spacing="0.5">STORED PERSONA-DEFINING FRAGMENTS</text>
    <text x="102" y="775" font-size="25" font-weight="700">Characteristic prompt parts</text>
    <rect x="102" y="807" width="420" height="145" rx="10" fill="#f9fbf7"/>
    <text x="120" y="837" font-size="17" font-weight="700" letter-spacing="0.7" fill="#476059">HYPOTHETICAL OWN-VOICE FRAGMENT</text>
    <text x="120" y="875" font-size="23" font-style="italic">“I like an early usable version.</text>
    <text x="120" y="906" font-size="23" font-style="italic">For editable work, I look for</text>
    <text x="120" y="937" font-size="23" font-style="italic">my early reopen checks.”</text>
    <text x="102" y="992" font-size="21">Authored search / grep / regex cues</text>
    <text x="102" y="1029" font-size="21" font-weight="700">Create · revise · organize · retire</text>
    <text x="102" y="1062" font-size="19" fill="#476059">Refine useful perspective; no endless growth</text>

    <rect x="72" y="1110" width="480" height="410" rx="20" fill="#edf0f3" stroke="#a6b8c2" stroke-width="2"/>
    <text x="102" y="1152" font-size="18" font-weight="700" letter-spacing="0.5">SEPARATELY STORED SUPPORT</text>
    <text x="102" y="1195" font-size="25" font-weight="700">Available ≠ in the prompt</text>
    <text x="102" y="1242" font-size="23">Domain knowledge · records</text>
    <text x="102" y="1283" font-size="23">Tools · skills · procedures</text>
    <text x="102" y="1324" font-size="23">Scripts · code · data</text>
    <line x1="102" y1="1356" x2="522" y2="1356" stroke="#b6c5cd" stroke-width="2"/>
    <text x="102" y="1394" font-size="21">Real authorship and source limits stay</text>
    <text x="102" y="1430" font-size="21">Stored catalogues remain outside</text>
    <text x="102" y="1466" font-size="21" font-weight="700">Store · refine · organize · retire</text>
    <text x="102" y="1500" font-size="18" fill="#50676c">Purpose, not author, distinguishes assets</text>

    <rect x="660" y="690" width="480" height="830" rx="20" fill="#ddede9" stroke="#137769" stroke-width="3"/>
    <text x="690" y="732" font-size="18" font-weight="700">PRIMARY LLM / PERSONA REASONING</text>
    <text x="690" y="777" font-size="29" font-weight="700">Reason + act + maintain</text>
    <text x="690" y="822" font-size="23">Small bootstrap + current need</text>
    <rect x="690" y="852" width="420" height="204" rx="10" fill="#f6fbf8" stroke="#b4cfc4" stroke-width="1.5"/>
    <text x="708" y="886" font-size="18" font-weight="700" letter-spacing="0.4">ACTUALLY SUPPLIED CONTEXT</text>
    <text x="708" y="925" font-size="21">Character + protected required state</text>
    <text x="708" y="962" font-size="21">Selected fragments + exact support</text>
    <text x="708" y="999" font-size="21">Needed operative definitions</text>
    <text x="708" y="1036" font-size="20">Complete required qualifications</text>
    <text x="690" y="1097" font-size="22" font-weight="700" fill="#116d61">Primary chooses what comes next</text>
    <text x="690" y="1134" font-size="21">Bounded query / known exact references</text>
    <text x="690" y="1170" font-size="21">Exact fragment + resource selection</text>
    <text x="690" y="1205" font-size="20">Never preload the whole catalogue</text>
    <rect x="690" y="1238" width="420" height="229" rx="10" fill="#f6fbf8" stroke="#b4cfc4" stroke-width="1.5"/>
    <text x="708" y="1274" font-size="18" font-weight="700" letter-spacing="0.4">EVERY CALL: MAINTENANCE + NEXT</text>
    <text x="708" y="1309" font-size="21" font-weight="700">Fragments + supporting assets</text>
    <text x="708" y="1348" font-size="23">Proposed changes</text>
    <text x="708" y="1384" font-size="23">Justified no change</text>
    <text x="708" y="1420" font-size="23">Blocked / bounded deferral</text>
    <text x="708" y="1451" font-size="17">No forced writes or extra reflection call</text>
    <text x="690" y="1500" font-size="19">Failed call: no invented persona outcome</text>

    <rect x="1248" y="690" width="480" height="830" rx="20" fill="#e9edf0" stroke="#a6b8c2" stroke-width="2"/>
    <text x="1278" y="732" font-size="18" font-weight="700" letter-spacing="0.5">ACTUAL WORK AND INTERACTION</text>
    <text x="1278" y="777" font-size="29" font-weight="700">Authorized work</text>
    <text x="1278" y="824" font-size="22">Task needs · human conversations</text>
    <text x="1278" y="861" font-size="22">Peer cooperation and disagreement</text>
    <rect x="1278" y="900" width="420" height="196" rx="10" fill="#f8fafb" stroke="#b6c5cd" stroke-width="1.5"/>
    <text x="1296" y="936" font-size="18" font-weight="700" letter-spacing="0.4">HOST-ADMITTED OPERATION</text>
    <text x="1296" y="975" font-size="21">Current authority + usable capability</text>
    <text x="1296" y="1012" font-size="21">Source, dependencies, and full data</text>
    <text x="1296" y="1047" font-size="21">can stay outside model context</text>
    <text x="1296" y="1080" font-size="18">Loaded guidance grants no permission</text>
    <text x="1278" y="1144" font-size="24" font-weight="700">Observe actual consequences</text>
    <text x="1278" y="1185" font-size="22">Tool results and earlier choices</text>
    <text x="1278" y="1224" font-size="22">Plans are not observations</text>
    <line x1="1278" y1="1253" x2="1698" y2="1253" stroke="#b6c5cd" stroke-width="2"/>
    <text x="1278" y="1292" font-size="22">Evidence can refine methods,</text>
    <text x="1278" y="1327" font-size="22">relationships, fragments, and cues</text>
    <text x="1278" y="1385" font-size="21">Maturation need not alter traits</text>
    <text x="1278" y="1464" font-size="22">Failures, waits, and uncertainty</text>
    <text x="1278" y="1498" font-size="22">remain visible</text>

