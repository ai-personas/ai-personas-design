<svg xmlns="http://www.w3.org/2000/svg" width="560" height="2258" viewBox="0 0 560 2258" role="img" aria-labelledby="title description">
  <title id="title">How a continuing persona works</title>
  <desc id="description">Two separately purposed stores supply chosen context to the primary LLM. Actual decisions and consequences inform later revision. Every call also has maintenance and next-context duties. Expressive cartoon characters and concrete artifacts illustrate the mechanism; this is a hypothetical teaching scene.</desc>
