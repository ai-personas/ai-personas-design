    <path d="M481 1788 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="49" y="1788" font-size="23" fill="#00665f" font-weight="700"><tspan x="49" dy="0">Observe and consider revision</tspan></text>
    <text x="50" y="1873" font-size="22" fill="#16332f"><tspan x="50" dy="0">Record actual consequences. The</tspan><tspan x="50" dy="31">primary LLM proposes useful</tspan><tspan x="50" dy="31">changes, or states no change, a block or</tspan><tspan x="50" dy="31">a deferral.</tspan></text>
    <path d="M29 2021 L531 2019 L527 2132 L32 2130 Z" stroke="#885000" stroke-width="1.5" fill="#fff0cd" stroke-linecap="round" stroke-linejoin="round" />
    <text x="46" y="2049" font-size="20" fill="#16332f"><tspan x="46" dy="0">The next call uses the accepted selection and</tspan><tspan x="46" dy="29">current state. The loop is a design</tspan><tspan x="46" dy="29">responsibility, not proof of beneficial behavior.</tspan></text>
    <text x="30" y="2167" font-size="19" fill="#405d58"><tspan x="30" dy="0">Characters personify design choices; they do not</tspan><tspan x="30" dy="28">assert feelings or consciousness. Scenes are</tspan><tspan x="30" dy="28">hypothetical.</tspan></text>
