    <line x1="72" y1="1972" x2="1728" y2="1972" stroke="#bac7c8" stroke-width="2"/>
    <text x="72" y="2012" font-size="23" font-weight="700">Bound retained storage and each prompt. Measure useful results and total episode cost.</text>
    <text x="72" y="2050" font-size="22">Host protects: authority · source restrictions · versions · retention · budgets · cancellation · effects</text>
    <text x="72" y="2086" font-size="20">Count discovery, reads, schemas, maintenance, retries, and execution; a smaller final prompt is not proof.</text>
    <text x="72" y="2117" font-size="17" fill="#50676c">Target design; no claim of consciousness, human equivalence, or proven benefit. Full reading: VISUAL-GUIDE.md</text>
