    <text x="50" y="1049" font-size="22" fill="#16332f"><tspan x="50" dy="0">Use known exact references or chosen</tspan><tspan x="50" dy="31">file search. Explicit preserve or no</tspan><tspan x="50" dy="31">optional need can be enough.</tspan></text>
