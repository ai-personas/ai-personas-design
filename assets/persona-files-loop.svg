<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2130" viewBox="0 0 1800 2130" role="img" aria-labelledby="title description">
  <title id="title">A persona forms its characteristic context and selects only needed supporting resources</title>
  <desc id="description">The whole characteristic-context, reasoning, interaction, and self-revision loop constitutes the persona. In the normal creation path, an attributed trait seed reaches a bounded initial LLM authoring call, which authors own-voice characteristic prompt fragments; coherent acceptance establishes the initial character account without inventing lived experience. This initialization role can use the continuing primary configuration or a separately declared, admitted one. The continuing primary receives the accepted fragments with actual attribution; no second continuing author or extra handoff call is required. One accepted, versioned OCEAN profile and VAD modeled affect shape later own-voice fragments and discretionary decisions. The left column distinguishes persona-defining fragments from separately retained domain knowledge, history, tool-use records, tool definitions, skills, scripts, code, and data regardless of authorship. Purpose, not first-person styling, distinguishes assets from characteristic fragments. These stores are not automatically in the prompt. Starting from a small usable bootstrap, the same primary chooses bounded discovery or known exact references and the exact fragment and supporting context needed next. The host supplies only selected eligible content, needed operative definitions, required qualifications, and protected mandatory state. It never preloads a whole catalogue for an LLM to filter. A discovery hit, full read, selection, actual exposure, authorized invocation, and observed result are distinct. Script source, dependencies, and full datasets need not enter the prompt merely because an authorized operation uses them. Every persona invocation has unified maintenance input covering persona-defining fragments and supporting assets, plus a required explicit next-context disposition for fragments and supporting resources in every accepted response, including appropriate preservation or no optional need. Missing intent invalidates the response; recovery-preserved state is not authored consideration. Its maintenance outcome is proposed changes, justified no change, or a blocked or bounded deferred outcome. The primary may propose storage paths and search cues; only actual accepted save receipts establish retained changes. The host validates the whole response before substantive dispatch, commits exact accepted changes, records actual supply and outcomes, and preserves authority, source restrictions, versions, retention, budgets, cancellation, and unresolved effects. Actual consequences can support ordinary refinement without changing traits. A separate dashed return path shows optional user-permitted effective-character revision; an exact accepted change requires a fresh primary decision before further operations. Both retained storage and supplied context are bounded. Efficiency is judged by useful results and total episode cost, not just a small final prompt. This is target-design artwork, not a product trace or proof of benefit.</desc>
