    <text x="49" y="1228" font-size="23" fill="#00665f" font-weight="700"><tspan x="49" dy="0">Supply what the decision</tspan><tspan x="49" dy="32">needs</tspan></text>
    <text x="50" y="1345" font-size="22" fill="#16332f"><tspan x="50" dy="0">Current character and mandatory work</tspan><tspan x="50" dy="31">state join the selected exact text and</tspan><tspan x="50" dy="31">complete qualifications.</tspan></text>
