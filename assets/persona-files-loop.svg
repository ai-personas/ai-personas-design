    <text x="43" y="748" font-size="21" fill="#16332f"><tspan x="43" dy="0">How this persona</tspan><tspan x="43" dy="30">approaches,</tspan><tspan x="43" dy="30">behaves and</tspan><tspan x="43" dy="30">speaks.</tspan></text>
