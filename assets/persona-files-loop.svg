    <text x="770" y="1640" text-anchor="end" font-size="21">+ maintenance / next-choice duties</text>

    <rect x="250" y="1684" width="1300" height="244" rx="20" fill="#fffdf3" stroke="#c6bd91" stroke-width="2"/>
    <text x="282" y="1726" font-size="19" font-weight="700" letter-spacing="0.6">HOST VALIDATES THE WHOLE RESPONSE BEFORE SUBSTANTIVE DISPATCH</text>
    <text x="282" y="1770" font-size="25" font-weight="700">Commit exact accepted changes; record maintenance, saves, and actual supply.</text>
    <text x="282" y="1812" font-size="23">Faithful assembly: required state + selected fragments, support, and callable definitions</text>
    <text x="282" y="1853" font-size="22">Discovery ≠ full read ≠ selection ≠ exposure ≠ authorized invocation ≠ observed result</text>
    <text x="282" y="1895" font-size="21">Check the whole next request; preserve qualifications. Missing required context: recover or block.</text>
