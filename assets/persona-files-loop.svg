    <text x="50" y="1609" font-size="22" fill="#16332f"><tspan x="50" dy="0">The persona’s perspective informs</tspan><tspan x="50" dy="31">choices about the task, tools and</tspan><tspan x="50" dy="31">cooperation.</tspan></text>
