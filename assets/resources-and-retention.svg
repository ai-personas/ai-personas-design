<svg xmlns="http://www.w3.org/2000/svg" width="560" height="2287" viewBox="0 0 560 2287" role="img" aria-labelledby="title description">
  <title id="title">A small prompt is not a small total footprint</title>
  <desc id="description">The accounting includes active, retained, derived, operational and external managed state, with peak rewrite copies. Protected obligations and user-owned deliverables cannot disappear merely to meet a cap. Expressive cartoon characters and concrete artifacts illustrate the mechanism; this is a hypothetical teaching scene.</desc>
  <rect width="560" height="2287" fill="#fffaf0"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="28" y="55" font-size="27" fill="#16332f" font-weight="700"><tspan x="28" dy="0">A small prompt is not a small</tspan><tspan x="28" dy="36">total footprint</tspan></text>
    <text x="28" y="129" font-size="17" fill="#00665f" font-weight="700"><tspan x="28" dy="0">AN ILLUSTRATED DESIGN STORY</tspan></text>
    <rect x="20" y="153" width="520" height="330" rx="20" fill="#e5f4ed" stroke="#d0d5cb" stroke-width="1"/>
    <rect x="34" y="168" width="490" height="87" rx="20" fill="#ffffff" stroke="#00665f" stroke-width="3"/>
    <path d="M59 253 L62 275 L84 253" stroke="#00665f" stroke-width="3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <text x="49" y="200" font-size="22" fill="#00665f" font-weight="700"><tspan x="49" dy="0">Count the storage behind the small</tspan><tspan x="49" dy="31">prompt.</tspan></text>
    <path d="M60 325 L113 325 L127 339 L125 404 L56 401 Z" stroke="#00665f" stroke-width="3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M113 325 V340 H127" stroke="#00665f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M68 350 H115" stroke="#00665f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M68 362 H115" stroke="#00665f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M68 374 H115" stroke="#00665f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="42" y="431" font-size="19" fill="#00665f" font-weight="700"><tspan x="42" dy="0">Prompt</tspan></text>
    <rect x="256" y="359" width="78" height="57" rx="3" fill="#fff0cd" stroke="#885000" stroke-width="3"/>
    <rect x="348" y="359" width="78" height="57" rx="3" fill="#fff0cd" stroke="#885000" stroke-width="3"/>
    <rect x="440" y="359" width="78" height="57" rx="3" fill="#fff0cd" stroke="#885000" stroke-width="3"/>
    <rect x="305" y="301" width="78" height="57" rx="3" fill="#fff0cd" stroke="#885000" stroke-width="3"/>
    <rect x="397" y="301" width="78" height="57" rx="3" fill="#fff0cd" stroke="#885000" stroke-width="3"/>
    <text x="240" y="451" font-size="20" fill="#885000" font-weight="700"><tspan x="240" dy="0">Versions · archives ·</tspan><tspan x="240" dy="29">caches</tspan></text>
    <path d="M146 372 H223" stroke="#00665f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M28 505 L529 503 L525 558 L32 556 Z" stroke="#00665f" stroke-width="2" fill="#00665f" stroke-linecap="round" stroke-linejoin="round" />
    <text x="47" y="535" font-size="22" fill="#ffffff" font-weight="700"><tspan x="47" dy="0">Count the whole managed footprint</tspan></text>
    <path d="M29 582 L529 580 L531 799 L27 802 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="590" width="486" height="84" rx="16" fill="#e5f4ed" stroke="none" stroke-width="0"/>
    <ellipse cx="76" cy="614" rx="20" ry="21" fill="#f5d9ae" stroke="#00665f" stroke-width="2"/>
    <ellipse cx="70" cy="611" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="83" cy="611" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M71 622 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="112" y="622" font-size="23" fill="#00665f" font-weight="700"><tspan x="112" dy="0">Current working material</tspan></text>
    <text x="50" y="707" font-size="22" fill="#16332f"><tspan x="50" dy="0">Fragments, supporting knowledge, skills,</tspan><tspan x="50" dy="31">tools, code, data, history and required</tspan><tspan x="50" dy="31">work state.</tspan></text>
    <path d="M29 826 L529 824 L531 1075 L27 1078 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="834" width="486" height="116" rx="16" fill="#e8effb" stroke="none" stroke-width="0"/>
    <ellipse cx="486" cy="858" rx="20" ry="21" fill="#b9dce5" stroke="#245599" stroke-width="2"/>
    <ellipse cx="480" cy="855" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="493" cy="855" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M481 866 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="49" y="866" font-size="23" fill="#245599" font-weight="700"><tspan x="49" dy="0">Retained and derived</tspan><tspan x="49" dy="32">material</tspan></text>
    <text x="50" y="983" font-size="22" fill="#16332f"><tspan x="50" dy="0">Old versions, archives, cues, indexes,</tspan><tspan x="50" dy="31">aliases, source copies, provenance,</tspan><tspan x="50" dy="31">qualifications and warnings.</tspan></text>
    <path d="M29 1102 L529 1100 L531 1382 L27 1385 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="1110" width="486" height="116" rx="16" fill="#fff0cd" stroke="none" stroke-width="0"/>
    <ellipse cx="76" cy="1134" rx="20" ry="21" fill="#f5d9ae" stroke="#245599" stroke-width="2"/>
    <ellipse cx="70" cy="1131" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="83" cy="1131" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M71 1142 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="112" y="1142" font-size="23" fill="#245599" font-weight="700"><tspan x="112" dy="0">Operational and external</tspan><tspan x="112" dy="32">backing</tspan></text>
    <text x="50" y="1259" font-size="22" fill="#16332f"><tspan x="50" dy="0">Effect/context records, caches, managed</tspan><tspan x="50" dy="31">exports and backups, externally retained</tspan><tspan x="50" dy="31">context and temporary rewrite</tspan><tspan x="50" dy="31">duplication.</tspan></text>
    <path d="M29 1409 L529 1407 L531 1689 L27 1692 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="1417" width="486" height="116" rx="16" fill="#f8e8ec" stroke="none" stroke-width="0"/>
    <ellipse cx="486" cy="1441" rx="20" ry="21" fill="#b9dce5" stroke="#885000" stroke-width="2"/>
    <ellipse cx="480" cy="1438" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="493" cy="1438" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M481 1449 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="49" y="1449" font-size="23" fill="#885000" font-weight="700"><tspan x="49" dy="0">Protect required state before</tspan><tspan x="49" dy="32">optional growth</tspan></text>
    <text x="50" y="1566" font-size="22" fill="#16332f"><tspan x="50" dy="0">Reserve room for unresolved obligations,</tspan><tspan x="50" dy="31">warnings, reconciliation and closeout. An</tspan><tspan x="50" dy="31">unmeasured external tier makes the</tspan><tspan x="50" dy="31">total bound incomplete.</tspan></text>
    <path d="M29 1716 L529 1714 L531 1996 L27 1999 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="1724" width="486" height="116" rx="16" fill="#e5f4ed" stroke="none" stroke-width="0"/>
    <ellipse cx="76" cy="1748" rx="20" ry="21" fill="#f5d9ae" stroke="#00665f" stroke-width="2"/>
    <ellipse cx="70" cy="1745" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="83" cy="1745" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M71 1756 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="112" y="1756" font-size="23" fill="#00665f" font-weight="700"><tspan x="112" dy="0">At the limit: make an honest</tspan><tspan x="112" dy="32">decision</tspan></text>
    <text x="50" y="1873" font-size="22" fill="#16332f"><tspan x="50" dy="0">Use actual retention policy, permitted</tspan><tspan x="50" dy="31">consolidation or an explicit capacity</tspan><tspan x="50" dy="31">block. Do not hide an unlimited archive</tspan><tspan x="50" dy="31">or erase required state.</tspan></text>
    <path d="M29 2021 L531 2019 L527 2161 L32 2159 Z" stroke="#885000" stroke-width="1.5" fill="#fff0cd" stroke-linecap="round" stroke-linejoin="round" />
    <text x="46" y="2049" font-size="20" fill="#16332f"><tspan x="46" dy="0">User-owned delivered artifacts are not deleted</tspan><tspan x="46" dy="29">or revoked to make the persona’s storage cap</tspan><tspan x="46" dy="29">fit. A digest is not recoverable original</tspan><tspan x="46" dy="29">evidence.</tspan></text>
    <text x="30" y="2196" font-size="19" fill="#405d58"><tspan x="30" dy="0">Characters personify design choices; they do not</tspan><tspan x="30" dy="28">assert feelings or consciousness. Scenes are</tspan><tspan x="30" dy="28">hypothetical.</tspan></text>
  </g>
</svg>
