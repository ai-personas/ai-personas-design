<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Record, execute, observe—and recover honestly</title><desc id="desc">A current complete decision is accepted atomically with durable effect intent. Dispatch is followed by observed or uncertain outcomes. Reconciliation and fresh decisions preserve original authority, stops, provenance and obligations.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20334b}.title{font-size:46px;font-weight:700}.subtitle{font-size:25px;fill:#536477}.heading{font-size:28px;font-weight:700}.body{font-size:24px}.edge{font-size:21px;fill:#536477}.note{font-size:25px;font-weight:700}.small{font-size:21px;fill:#536477}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="#63758a"/></marker></defs><rect width="1600" height="1000" fill="#ffffff"/><rect x="64" y="48" width="72" height="7" rx="3" fill="#236e60"/>
<text x="64" y="113" class="title"><tspan x="64" dy="0">Record, execute, observe—and recover honestly</tspan></text>
<text x="64" y="158" class="subtitle"><tspan x="64" dy="0">An uncertain outside effect is neither known success nor permission to repeat it.</tspan></text>
<rect x="64" y="230" width="416" height="208" rx="18" fill="#eee9ff" stroke="#6551a5" stroke-width="2"/>
<circle cx="98" cy="266" r="19" fill="#6551a5"/>
<text x="98" y="274" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">1</text>
<text x="130" y="275" class="heading"><tspan x="130" dy="0">Current decision</tspan></text>
<text x="88" y="324" class="body"><tspan x="88" dy="0">Bind the actual model, work,</tspan><tspan x="88" dy="32">inputs and applicable</tspan><tspan x="88" dy="32">controls.</tspan></text>
<rect x="592" y="230" width="416" height="208" rx="18" fill="#fff2d8" stroke="#8b6018" stroke-width="2"/>
<circle cx="626" cy="266" r="19" fill="#8b6018"/>
<text x="626" y="274" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">2</text>
<text x="658" y="275" class="heading"><tspan x="658" dy="0">Atomic acceptance</tspan></text>
<text x="616" y="324" class="body"><tspan x="616" dy="0">Persist accepted changes and</tspan><tspan x="616" dy="32">external-effect intent</tspan><tspan x="616" dy="32">together.</tspan></text>
<rect x="1120" y="230" width="416" height="208" rx="18" fill="#e8f0ff" stroke="#315d94" stroke-width="2"/>
<circle cx="1154" cy="266" r="19" fill="#315d94"/>
<text x="1154" y="274" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">3</text>
<text x="1186" y="275" class="heading"><tspan x="1186" dy="0">Dispatch once</tspan></text>
<text x="1144" y="324" class="body"><tspan x="1144" dy="0">An accepted request is not</tspan><tspan x="1144" dy="32">yet an observed successful</tspan><tspan x="1144" dy="32">effect.</tspan></text>
<rect x="1120" y="560" width="416" height="208" rx="18" fill="#e3f3ef" stroke="#236e60" stroke-width="2"/>
<circle cx="1154" cy="596" r="19" fill="#236e60"/>
<text x="1154" y="604" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">4</text>
<text x="1186" y="605" class="heading"><tspan x="1186" dy="0">Observe the outcome</tspan></text>
<text x="1144" y="654" class="body"><tspan x="1144" dy="0">Keep success, failure,</tspan><tspan x="1144" dy="32">incomplete and unknown</tspan><tspan x="1144" dy="32">outcomes distinct.</tspan></text>
<rect x="592" y="560" width="416" height="208" rx="18" fill="#fff2d8" stroke="#8b6018" stroke-width="2"/>
<circle cx="626" cy="596" r="19" fill="#8b6018"/>
<text x="626" y="604" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">5</text>
<text x="658" y="605" class="heading"><tspan x="658" dy="0">Reconcile uncertainty</tspan></text>
<text x="616" y="654" class="body"><tspan x="616" dy="0">Inspect retained receipts and</tspan><tspan x="616" dy="32">destination evidence before</tspan><tspan x="616" dy="32">replay.</tspan></text>
<rect x="64" y="560" width="416" height="208" rx="18" fill="#e8f0ff" stroke="#315d94" stroke-width="2"/>
<circle cx="98" cy="596" r="19" fill="#315d94"/>
<text x="98" y="604" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">6</text>
<text x="130" y="605" class="heading"><tspan x="130" dy="0">Fresh continuation</tspan></text>
<text x="88" y="654" class="body"><tspan x="88" dy="0">Use current state. Preserve</tspan><tspan x="88" dy="32">duties, exact history and</tspan><tspan x="88" dy="32">explicit stops.</tspan></text>
<path d="M480 334 H592" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="480" y="284" width="82" height="30" rx="4" fill="white"/>
<text x="488" y="307" class="edge"><tspan x="488" dy="0">accept</tspan></text>
<path d="M1008 334 H1120" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1008" y="284" width="104" height="30" rx="4" fill="white"/>
<text x="1016" y="307" class="edge"><tspan x="1016" dy="0">dispatch</tspan></text>
<path d="M1328 438 V560" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1346" y="483" width="93" height="30" rx="4" fill="white"/>
<text x="1354" y="506" class="edge"><tspan x="1354" dy="0">observe</tspan></text>
<path d="M1120 664 H1008" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1008" y="615" width="93" height="30" rx="4" fill="white"/>
<text x="1016" y="638" class="edge"><tspan x="1016" dy="0">unknown</tspan></text>
<path d="M592 664 H480" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="480" y="615" width="82" height="30" rx="4" fill="white"/>
<text x="488" y="638" class="edge"><tspan x="488" dy="0">decide</tspan></text>
<path d="M64 664 H32 V334 H64" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="56" y="477" width="247" height="30" rx="4" fill="white"/>
<text x="64" y="500" class="edge"><tspan x="64" dy="0">next current decision</tspan></text>
<path d="M1328 768 V805 H272 V768" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="652" y="802" width="148" height="30" rx="4" fill="white"/>
<text x="660" y="825" class="edge"><tspan x="660" dy="0">known result</tspan></text>
<rect x="64" y="844" width="1472" height="79" rx="16" fill="#f2f5f8"/>
<text x="90" y="877" class="note"><tspan x="90" dy="0">A crash, timeout or cancellation request does not prove that a remote action never happened.</tspan></text>
<text x="64" y="962" class="small"><tspan x="64" dy="0">Conceptual design • Arrows show possible transitions, not demonstrated improvement.</tspan></text>
</svg>
