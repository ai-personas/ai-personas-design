<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Six different claims about development</title><desc id="desc">The evidence ladder distinguishes changed parameters, changed numerical response, actual supply to reasoning, changed behavior, useful outcomes and retained or transferred benefit. Missing evidence stays missing; no automatic maturity score is created.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20334b}.title{font-size:46px;font-weight:700}.subtitle{font-size:25px;fill:#536477}.heading{font-size:28px;font-weight:700}.body{font-size:24px}.edge{font-size:21px;fill:#536477}.note{font-size:25px;font-weight:700}.small{font-size:21px;fill:#536477}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="#63758a"/></marker></defs><rect width="1600" height="1000" fill="#ffffff"/><rect x="64" y="48" width="72" height="7" rx="3" fill="#236e60"/>
<text x="64" y="113" class="title"><tspan x="64" dy="0">Six different claims about development</tspan></text>
<text x="64" y="158" class="subtitle"><tspan x="64" dy="0">Evidence for one step does not automatically establish the next.</tspan></text>
<rect x="64" y="220" width="1472" height="78" rx="13" fill="#eee9ff" stroke="#6551a5" stroke-width="1.5"/>
<text x="90" y="269" class="heading">1</text>
<text x="145" y="269" class="heading"><tspan x="145" dy="0">Numbers changed</tspan></text>
<text x="610" y="269" class="body"><tspan x="610" dy="0">Exact old and new canonical parameter values.</tspan></text>
<rect x="64" y="315" width="1472" height="78" rx="13" fill="#eee9ff" stroke="#6551a5" stroke-width="1.5"/>
<text x="90" y="364" class="heading">2</text>
<text x="145" y="364" class="heading"><tspan x="145" dy="0">Function changed</tspan></text>
<text x="610" y="364" class="body"><tspan x="610" dy="0">Forward differences in the relevant situations.</tspan></text>
<rect x="64" y="410" width="1472" height="78" rx="13" fill="#fff2d8" stroke="#8b6018" stroke-width="1.5"/>
<text x="90" y="459" class="heading">3</text>
<text x="145" y="459" class="heading"><tspan x="145" dy="0">Actually used</tspan></text>
<text x="610" y="459" class="body"><tspan x="610" dy="0">Exact model outputs reached the later reasoning call.</tspan></text>
<rect x="64" y="505" width="1472" height="78" rx="13" fill="#e8f0ff" stroke="#315d94" stroke-width="1.5"/>
<text x="90" y="554" class="heading">4</text>
<text x="145" y="554" class="heading"><tspan x="145" dy="0">Behavior changed</tspan></text>
<text x="610" y="554" class="body"><tspan x="610" dy="0">Observed decisions or communication—not self-description.</tspan></text>
<rect x="64" y="600" width="1472" height="78" rx="13" fill="#e3f3ef" stroke="#236e60" stroke-width="1.5"/>
<text x="90" y="649" class="heading">5</text>
<text x="145" y="649" class="heading"><tspan x="145" dy="0">The change helped</tspan></text>
<text x="610" y="649" class="body"><tspan x="610" dy="0">A useful consequence with competing causes considered.</tspan></text>
<rect x="64" y="695" width="1472" height="78" rx="13" fill="#e3f3ef" stroke="#236e60" stroke-width="1.5"/>
<text x="90" y="744" class="heading">6</text>
<text x="145" y="744" class="heading"><tspan x="145" dy="0">Benefit transferred</tspan></text>
<text x="610" y="744" class="body"><tspan x="610" dy="0">Retained value in later work or social interaction.</tspan></text>
<rect x="64" y="844" width="1472" height="79" rx="16" fill="#f2f5f8"/>
<text x="90" y="877" class="note"><tspan x="90" dy="0">A biography, model epoch, completed comparison or growing history cannot substitute for this evidence.</tspan></text>
<text x="64" y="962" class="small"><tspan x="64" dy="0">Conceptual design • Arrows show possible transitions, not demonstrated improvement.</tspan></text>
</svg>
