<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-labelledby="title desc"><title id="title">Permission before selection</title><desc id="desc">Current-store checks verify source permissions and approved processing before an optional selector receives anything. Valid assessments proceed to a final freshness, cancellation, and budget recheck. Denied or unavailable semantic selection can use only the declared permitted local fallback. The final check either admits the main call or blocks and reports the problem. No fallback invents approval or replays effects.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#FCFBF7"/><stop offset="1" stop-color="#EDF4F2"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#087F83" stroke-width="1.6"/></marker></defs><rect width="1440" height="960" fill="url(#paper)"/><path d="M60 168H1380" stroke="#D3DFDD"/><text x="60" y="57" fill="#087F83" font-size="15" font-weight="700" letter-spacing="2">AI PERSONAS  /  DESIGN ATLAS  /  05</text><text x="60" y="113" fill="#173042" font-size="44" font-weight="700">Permission before selection</text><text x="60" y="148" fill="#526774" font-size="20">Model advice cannot widen access, renew funding, or replace a fresh admission check.</text><text x="60" y="931" fill="#526774" font-size="13" font-weight="600" letter-spacing="1">DESIGN TARGET  •  NOT A LIVE PRODUCT TRACE</text><text x="1380" y="931" fill="#526774" font-size="13" font-weight="600" text-anchor="end" letter-spacing="1">FRAGMENT RECALL  /  05</text><rect x="60" y="245" width="360" height="195" rx="20" fill="#FFFFFF" stroke="#C9D6D9" stroke-width="1.4"/><text x="84" y="279" fill="#087F83" font-size="13" font-weight="700" letter-spacing="1.5">BEFORE DISCLOSURE</text><text x="84" y="322" fill="#173042" font-size="27" font-weight="700">Current-store checks</text><text x="84" y="362.0" fill="#526774" font-size="19">Owner and source permissions.</text><text x="84" y="390.12" fill="#526774" font-size="19">Approved processing destination.</text><text x="84" y="418.24" fill="#526774" font-size="19">Finite funded exposure.</text><rect x="540" y="245" width="360" height="195" rx="20" fill="#EAF0FB" stroke="#C9D6D9" stroke-width="1.4"/><text x="564" y="279" fill="#087F83" font-size="13" font-weight="700" letter-spacing="1.5">ADVISORY ONLY</text><text x="564" y="322" fill="#173042" font-size="27" font-weight="700">Optional selector</text><text x="564" y="362.0" fill="#526774" font-size="19">Receives a permitted shortlist.</text><text x="564" y="390.12" fill="#526774" font-size="19">Returns assessments, not actions.</text><text x="564" y="418.24" fill="#526774" font-size="19">Cannot expand permissions.</text><rect x="1020" y="245" width="360" height="195" rx="20" fill="#FFFFFF" stroke="#C9D6D9" stroke-width="1.4"/><text x="1044" y="279" fill="#087F83" font-size="13" font-weight="700" letter-spacing="1.5">BEFORE MAIN DISPATCH</text><text x="1044" y="322" fill="#173042" font-size="27" font-weight="700">Final recheck</text><text x="1044" y="362.0" fill="#526774" font-size="19">Versions and cancellation.</text><text x="1044" y="390.12" fill="#526774" font-size="19">Current character and authority.</text><text x="1044" y="418.24" fill="#526774" font-size="19">Whole-request budget.</text><path d="M428 342H528" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M908 342H1008" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M240 440V597" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="258" y="507" fill="#526774" font-size="16">Remote processing</text><text x="258" y="530" fill="#526774" font-size="16">not permitted</text><path d="M720 440V539H425V597" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="559" y="507" fill="#526774" font-size="16">Unavailable or invalid</text><rect x="60" y="609" width="420" height="185" rx="20" fill="#FBF0DA" stroke="#C9D6D9" stroke-width="1.4"/><text x="84" y="643" fill="#087F83" font-size="13" font-weight="700" letter-spacing="1.5">DECLARED RECOVERY</text><text x="84" y="686" fill="#173042" font-size="27" font-weight="700">Permitted local fallback</text><text x="84" y="726.0" fill="#526774" font-size="19">No invented Jev approval.</text><text x="84" y="754.12" fill="#526774" font-size="19">No extra access, money, or replay.</text><path d="M488 695H970V390H1012" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="582" y="672" fill="#526774" font-size="17">Recheck the fallback too</text><path d="M1200 440V562" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1220" y="527" fill="#087F83" font-size="16" font-weight="600">Ready</text><rect x="1020" y="575" width="360" height="84" rx="20" fill="#E5F3EE" stroke="#E5F3EE" stroke-width="1.4"/><text x="1200" y="626" fill="#173042" font-size="25" font-weight="600" text-anchor="middle">Admit the main call</text><path d="M1380 398H1405V758H1388" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/><rect x="1020" y="716" width="360" height="84" rx="20" fill="#FAEAE6" stroke="#FAEAE6" stroke-width="1.4"/><text x="1200" y="750" fill="#9C4D4B" font-size="21" font-weight="600" text-anchor="middle">Stale or cannot fit</text><text x="1200" y="779" fill="#9C4D4B" font-size="18" text-anchor="middle">Block or bounded recovery</text><rect x="60" y="840" width="1320" height="65" rx="16" fill="#E5F3EE" stroke="#E5F3EE" stroke-width="1.4"/><text x="720" y="880" fill="#173042" font-size="22" font-weight="600" text-anchor="middle">A selector failure is not a negative verdict on every fragment.</text></svg>
