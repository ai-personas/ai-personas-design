<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-labelledby="title desc"><title id="title">Learning happens in the work</title><desc id="desc">A hypothetical sequence shows three ordinary calls. First the persona sends a question and records only a tentative plan. After the real reply, it chooses a check and writes a scoped interpretation. Only after the real check result can it revise the method from evidence. Optional selector assessments precede ordinary calls; there is no extra generative reflection call.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#FCFBF7"/><stop offset="1" stop-color="#EDF4F2"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#087F83" stroke-width="1.6"/></marker></defs><rect width="1440" height="960" fill="url(#paper)"/><path d="M60 168H1380" stroke="#D3DFDD"/><text x="60" y="57" fill="#087F83" font-size="15" font-weight="700" letter-spacing="2">AI PERSONAS  /  DESIGN ATLAS  /  04</text><text x="60" y="113" fill="#173042" font-size="44" font-weight="700">Learning happens in the work</text><text x="60" y="148" fill="#526774" font-size="20">The same ordinary response contributes an action, an interpretation, and future attention.</text><text x="60" y="931" fill="#526774" font-size="13" font-weight="600" letter-spacing="1">DESIGN TARGET  •  NOT A LIVE PRODUCT TRACE</text><text x="1380" y="931" fill="#526774" font-size="13" font-weight="600" text-anchor="end" letter-spacing="1">FRAGMENT RECALL  /  04</text><rect x="60" y="213" width="370" height="36" rx="18" fill="#E5F3EE" stroke="#E5F3EE" stroke-width="1.4"/><text x="245.0" y="237" fill="#087F83" font-size="14" font-weight="600" text-anchor="middle">OPTIONAL RECALL ASSESSMENT</text><path d="M245 249V287" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="535" y="213" width="370" height="36" rx="18" fill="#E5F3EE" stroke="#E5F3EE" stroke-width="1.4"/><text x="720.0" y="237" fill="#087F83" font-size="14" font-weight="600" text-anchor="middle">OPTIONAL RECALL ASSESSMENT</text><path d="M720 249V287" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1010" y="213" width="370" height="36" rx="18" fill="#E5F3EE" stroke="#E5F3EE" stroke-width="1.4"/><text x="1195.0" y="237" fill="#087F83" font-size="14" font-weight="600" text-anchor="middle">OPTIONAL RECALL ASSESSMENT</text><path d="M1195 249V287" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="300" width="370" height="362" rx="20" fill="#FFFFFF" stroke="#C9D6D9" stroke-width="1.4"/><text x="84" y="337" fill="#087F83" font-size="14" font-weight="700" letter-spacing="1.5">CALL 1</text><text x="84" y="380" fill="#173042" font-size="27" font-weight="700">Send the question</text><text x="84" y="428" fill="#526774" font-size="19">Work: request a focused</text><text x="84" y="457" fill="#526774" font-size="19">second opinion.</text><path d="M84 492H406" stroke="#D3DFDD"/><text x="84" y="534" fill="#173042" font-size="19">Fragment: a tentative plan,</text><text x="84" y="564" fill="#173042" font-size="19">not a reply or a result.</text><text x="84" y="622" fill="#087F83" font-size="16" font-weight="600">Work + authored changes</text><rect x="535" y="300" width="370" height="362" rx="20" fill="#FFFFFF" stroke="#C9D6D9" stroke-width="1.4"/><text x="559" y="337" fill="#087F83" font-size="14" font-weight="700" letter-spacing="1.5">CALL 2</text><text x="559" y="380" fill="#173042" font-size="27" font-weight="700">Test the suggestion</text><text x="559" y="428" fill="#526774" font-size="19">Work: choose an actual check</text><text x="559" y="457" fill="#526774" font-size="19">after reading the real reply.</text><path d="M559 492H881" stroke="#D3DFDD"/><text x="559" y="534" fill="#173042" font-size="19">Fragment: a scoped account</text><text x="559" y="564" fill="#173042" font-size="19">of the exchange.</text><text x="559" y="622" fill="#087F83" font-size="16" font-weight="600">Work + authored changes</text><rect x="1010" y="300" width="370" height="362" rx="20" fill="#FFFFFF" stroke="#C9D6D9" stroke-width="1.4"/><text x="1034" y="337" fill="#087F83" font-size="14" font-weight="700" letter-spacing="1.5">CALL 3</text><text x="1034" y="380" fill="#173042" font-size="27" font-weight="700">Revise from evidence</text><text x="1034" y="428" fill="#526774" font-size="19">Work: repair or redirect</text><text x="1034" y="457" fill="#526774" font-size="19">using the observed result.</text><path d="M1034 492H1356" stroke="#D3DFDD"/><text x="1034" y="534" fill="#173042" font-size="19">Fragment: update the method</text><text x="1034" y="564" fill="#173042" font-size="19">and its exceptions.</text><text x="1034" y="622" fill="#087F83" font-size="16" font-weight="600">Work + authored changes</text><path d="M437 477H526" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="482" y="451" fill="#087F83" font-size="14" font-weight="600" text-anchor="middle">Actual reply</text><path d="M912 477H1001" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="957" y="451" fill="#087F83" font-size="14" font-weight="600" text-anchor="middle">Actual result</text><rect x="60" y="735" width="1320" height="100" rx="20" fill="#E5F3EE" stroke="#E5F3EE" stroke-width="1.4"/><text x="720" y="778" fill="#173042" font-size="25" font-weight="600" text-anchor="middle">One primary response = useful work + fragment updates + next-context intent</text><text x="720" y="811" fill="#526774" font-size="20" text-anchor="middle">A proposed effect never counts as an observed outcome.</text><text x="60" y="881" fill="#526774" font-size="18">Hypothetical Iris–Rowan sequence. It is not a measured live-model trace.</text></svg>
