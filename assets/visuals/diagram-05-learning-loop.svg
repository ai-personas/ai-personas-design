<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='1000' viewBox='0 0 1600 1000' role='img' aria-labelledby='title desc'>
<title id='title'>Retaining a memory is only the beginning.</title><desc id='desc'>Experience or feedback is interpreted by a persona. If it is not worth retaining, preserve only required work evidence. If it is, author or revise a fragment. A later relevant situation leads to authorized retrieval and selection, a different or better-informed action, and independent outcome assessment. Assessment returns to interpretation; improved outcomes are not guaranteed.</desc>
<defs><style>.t0{font-size:17px;fill:#526976}.t1{font-size:27px;fill:#173443;font-weight:700}.t2{font-size:19px;fill:#526976}.t3{font-size:28px;fill:#173443;font-weight:700}.p0{fill:none;stroke:#CAD6D5;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}.p1{fill:none;stroke:#00786D;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.r0{fill:#FFFFFF;stroke:#CAD6D5;rx:10}</style><marker id='arrow' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto-start-reverse' markerUnits='userSpaceOnUse'><path d='M0 0 8 4 0 8Z' fill='#00786D'/></marker></defs>
<g font-family='Lato, Arial, sans-serif'>
<rect x='0' y='0' width='1600' height='1000' fill='#F7F5EF'/>
<text x='72' y='58' font-size='18' fill='#00786D' font-weight='700'>AI PERSONAS / DESIGN FIELD GUIDE</text>
<text x='1528' y='58' font-size='18' fill='#00786D' font-weight='700' text-anchor='end'>SYSTEM DIAGRAM / D05</text>
<path d='M72 85H1528' class='p0'/>
<text x='72' y='164' font-size='64' fill='#102D3C' font-weight='700'>Retaining a memory is only the beginning.</text>
<text x='72' y='211' font-size='22' fill='#526976'>Useful learning requires later, permitted use and an independent assessment—not fragment counts.</text>
<path d='M72 938H1528' class='p0'/>
<text x='72' y='966' font-size='15' fill='#526976' font-weight='700'>PROPOSED DESIGN / NOT IMPLEMENTATION EVIDENCE</text>
<text x='1528' y='966' font-size='15' fill='#526976' text-anchor='end'>§ 7.4  /  VISUAL EDITION 01</text>
<path d='M372 365H450' marker-end='url(#arrow)' class='p1'/>
<path d='M790 365H855' marker-end='url(#arrow)' class='p1'/>
<path d='M1105 365H1200' marker-end='url(#arrow)' class='p1'/>
<path d='M980 420V540' marker-end='url(#arrow)' class='p1'/>
<path d='M1195 600H1250' marker-end='url(#arrow)' class='p1'/>
<path d='M1389 655V750' marker-end='url(#arrow)' class='p1'/>
<path d='M1250 805H1195' marker-end='url(#arrow)' class='p1'/>
<path d='M855 805H790' marker-end='url(#arrow)' class='p1'/>
<path d='M620 750V700H413V365H450' marker-end='url(#arrow)' class='p1'/>
<rect x='1132' y='326' width='50.359375' height='25' fill='#F7F5EF'/>
<text x='1138' y='345' class='t0'>No</text>
<rect x='991' y='466' width='53.078125' height='25' fill='#F7F5EF'/>
<text x='997' y='485' class='t0'>Yes</text>
<rect x='85' y='657' width='196.59375' height='25' fill='#F7F5EF'/>
<text x='91' y='676' class='t0'>reconsider significance</text>
<rect x='72' y='300' width='300' height='120' class='r0'/>
<text x='94' y='331' class='t1'>Experience</text>
<text x='94' y='370' class='t2'><tspan x='94' dy='0'>Observations and feedback,</tspan><tspan x='94' dy='25'>including failure.</tspan></text>
<rect x='450' y='300' width='340' height='120' class='r0'/>
<text x='472' y='331' class='t1'>Interpret significance</text>
<text x='472' y='370' class='t2'><tspan x='472' dy='0'>The persona authors its</tspan><tspan x='472' dy='25'>interpretation.</tspan></text>
<rect x='855' y='300' width='250' height='120' rx='10' fill='#FFF0D8' stroke='#D8BA8F'/>
<text x='877' y='331' class='t3'><tspan x='877' dy='0'>Worth</tspan><tspan x='877' dy='31'>retaining?</tspan></text>
<text x='877' y='402' class='t2'>Selective learning.</text>
<rect x='1200' y='300' width='328' height='120' class='r0'/>
<text x='1222' y='331' class='t3'>Keep work evidence</text>
<text x='1222' y='371' class='t2'>No fragment is required.</text>
<rect x='855' y='540' width='340' height='115' rx='10' fill='#E2F2EA' stroke='#00786D'/>
<text x='877' y='571' font-size='26' fill='#173443' font-weight='700'>Author / revise fragment</text>
<text x='877' y='609' class='t2'>Sources, applicability, and limits.</text>
<rect x='1250' y='540' width='278' height='115' class='r0'/>
<text x='1272' y='571' class='t3'>Later situation</text>
<text x='1272' y='611' class='t2'>Relevant new work.</text>
<rect x='1250' y='750' width='278' height='110' class='r0'/>
<text x='1272' y='781' class='t1'>Retrieve + select</text>
<text x='1272' y='820' class='t2'>Check current access.</text>
<rect x='855' y='750' width='340' height='110' class='r0'/>
<text x='877' y='781' class='t1'>Better-informed action</text>
<text x='877' y='820' class='t2'>A possible use chain—not proof.</text>
<rect x='450' y='750' width='340' height='110' rx='10' fill='#102D3C' stroke='#102D3C'/>
<text x='472' y='781' font-size='25' fill='#FFFFFF' font-weight='700'>Independent assessment</text>
<text x='472' y='818' font-size='19' fill='#D4E3E7'>Evaluate the actual outcome.</text>
<text x='72' y='908' class='t2'>Useful transfer needs outcome evidence under comparable conditions. A fragment may be corrected, withheld, or no longer selected.</text>
</g></svg>
