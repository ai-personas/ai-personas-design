<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='1000' viewBox='0 0 1600 1000' role='img' aria-labelledby='title desc'>
<title id='title'>Distinct perspectives. Accountable outcomes.</title><desc id='desc'>Three responsibility layers: humans own purpose and authorization; personas interpret and accept work; the supporting system enforces limits and preserves consequences. Six public concepts connect the design: persona, environment, work, fragment, capability, artifact and evidence.</desc>
<defs><style>.t0{font-size:16px;fill:#00786D;font-weight:700}.t1{font-size:33px;fill:#173443;font-weight:700}.t2{font-size:21px;fill:#526976}.t3{font-size:25px;fill:#102D3C;font-weight:700}.t4{font-size:18px;fill:#526976}.p0{fill:none;stroke:#CAD6D5;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}.p1{fill:none;stroke:#00786D;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}</style><marker id='arrow' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto-start-reverse' markerUnits='userSpaceOnUse'><path d='M0 0 8 4 0 8Z' fill='#00786D'/></marker></defs>
<g font-family='Lato, Arial, sans-serif'>
<rect x='0' y='0' width='1600' height='1000' fill='#F7F5EF'/>
<text x='72' y='58' font-size='18' fill='#00786D' font-weight='700'>AI PERSONAS / DESIGN FIELD GUIDE</text>
<text x='1528' y='58' font-size='18' fill='#00786D' font-weight='700' text-anchor='end'>OVERVIEW / P01</text>
<path d='M72 85H1528' class='p0'/>
<text x='72' y='164' font-size='64' fill='#102D3C' font-weight='700'>Distinct perspectives. Accountable outcomes.</text>
<text x='72' y='211' font-size='22' fill='#526976'>Persistent collaborators, cooperative work, and a substrate that enforces boundaries—not meaning.</text>
<path d='M72 938H1528' class='p0'/>
<text x='72' y='966' font-size='15' fill='#526976' font-weight='700'>PROPOSED DESIGN / NOT IMPLEMENTATION EVIDENCE</text>
<text x='1528' y='966' font-size='15' fill='#526976' text-anchor='end'>§§ 1–4  /  VISUAL EDITION 01</text>
<rect x='72' y='275' width='956' height='144' rx='10' fill='#102D3C' stroke='#CAD6D5'/>
<text x='100' y='304' font-size='16' fill='#7DE4CC' font-weight='700'>01 / HUMAN PURPOSE</text>
<text x='100' y='347' font-size='33' fill='#FFFFFF' font-weight='700'>Set the need. Authorize the boundaries.</text>
<text x='100' y='388' font-size='21' fill='#D4E3E7'>Purpose, scope, delegation, resource ceilings, and required acceptance.</text>
<rect x='72' y='454' width='956' height='144' rx='10' fill='#FFFFFF' stroke='#CAD6D5'/>
<text x='100' y='483' class='t0'>02 / PERSONA CHOICE</text>
<text x='100' y='526' class='t1'>Interpret. Negotiate. Choose.</text>
<text x='100' y='567' class='t2'>Distinct agendas, accepted commitments, methods, and authored learning.</text>
<rect x='72' y='633' width='956' height='144' rx='10' fill='#E2F2EA' stroke='#CAD6D5'/>
<text x='100' y='662' class='t0'>03 / RELIABLE SUBSTRATE</text>
<text x='100' y='705' class='t1'>Enforce limits. Preserve consequences.</text>
<text x='100' y='746' class='t2'>Access, reservations, safe execution, exact versions, and event delivery.</text>
<path d='M550 425V448' marker-end='url(#arrow)' class='p1'/>
<path d='M550 604V627' marker-end='url(#arrow)' class='p1'/>
<text x='1078' y='294' font-size='17' fill='#00786D' font-weight='700'>SIX PUBLIC CONCEPTS</text>
<text x='1078' y='333' class='t3'>Persona</text>
<text x='1078' y='362' class='t4'>Continuing identity and perspective</text>
<path d='M1078 379H1528' class='p0'/>
<text x='1078' y='413' class='t3'>Environment</text>
<text x='1078' y='442' class='t4'>Governed place, access, and context</text>
<path d='M1078 459H1528' class='p0'/>
<text x='1078' y='493' class='t3'>Work</text>
<text x='1078' y='522' class='t4'>Mandate, outcomes, and obligations</text>
<path d='M1078 539H1528' class='p0'/>
<text x='1078' y='573' class='t3'>Fragment</text>
<text x='1078' y='602' class='t4'>Authored learning with limitations</text>
<path d='M1078 619H1528' class='p0'/>
<text x='1078' y='653' class='t3'>Capability</text>
<text x='1078' y='682' class='t4'>Permitted means to observe or act</text>
<path d='M1078 699H1528' class='p0'/>
<text x='1078' y='733' class='t3'>Artifact + evidence</text>
<text x='1078' y='762' class='t4'>Exact results and supporting observations</text>
<path d='M1078 779H1528' class='p0'/>
<rect x='72' y='844' width='1456' height='94' rx='10' fill='#102D3C'/>
<text x='98' y='880' font-size='26' fill='#FFFFFF' font-weight='700'>Separate meaning, authority, and evidence.</text>
<text x='98' y='911' font-size='19' fill='#D4E3E7'>A shared record is not a single team mind. A successful operation is not proof of a correct result.</text>
</g></svg>
