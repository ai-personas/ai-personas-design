<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-labelledby="title desc"><title id="title">Connections with meaning</title><desc id="desc">Six hypothetical fragments form a network. Authored situations connect checking a discrepancy, tracing sources, asking Rowan, learning a rounding exception, comparing explanations, and preparing a question. A current-character fragment is consistently supplied by policy, not because it is a root. Corrections accompany the methods they qualify. Links recall information and do not execute actions.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#FCFBF7"/><stop offset="1" stop-color="#EDF4F2"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#087F83" stroke-width="1.6"/></marker></defs><rect width="1440" height="960" fill="url(#paper)"/><path d="M60 168H1380" stroke="#D3DFDD"/><text x="60" y="57" fill="#087F83" font-size="15" font-weight="700" letter-spacing="2">AI PERSONAS  /  DESIGN ATLAS  /  02</text><text x="60" y="113" fill="#173042" font-size="44" font-weight="700">Connections with meaning</text><text x="60" y="148" fill="#526774" font-size="20">One personal network. No folders, fixed functions, or root hierarchy.</text><text x="60" y="931" fill="#526774" font-size="13" font-weight="600" letter-spacing="1">DESIGN TARGET  •  NOT A LIVE PRODUCT TRACE</text><text x="1380" y="931" fill="#526774" font-size="13" font-weight="600" text-anchor="end" letter-spacing="1">FRAGMENT RECALL  /  02</text><path d="M345 290H562" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M855 290H1072" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1205 375V607" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M863 690H1072" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M562 690H353" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M202 607V383" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M712 375V607" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="388" y="255" fill="#087F83" font-size="16" font-weight="600">when I need</text><text x="388" y="277" fill="#087F83" font-size="16" font-weight="600">a small check</text><text x="900" y="255" fill="#087F83" font-size="16" font-weight="600">when a peer</text><text x="900" y="277" fill="#087F83" font-size="16" font-weight="600">has replied</text><text x="1225" y="482" fill="#087F83" font-size="16" font-weight="600">after new</text><text x="1225" y="504" fill="#087F83" font-size="16" font-weight="600">evidence</text><text x="900" y="650" fill="#087F83" font-size="16" font-weight="600">include the</text><text x="900" y="672" fill="#087F83" font-size="16" font-weight="600">exception</text><text x="389" y="650" fill="#087F83" font-size="16" font-weight="600">when I reuse</text><text x="389" y="672" fill="#087F83" font-size="16" font-weight="600">this approach</text><text x="66" y="481" fill="#087F83" font-size="16" font-weight="600">when I ask</text><text x="66" y="503" fill="#087F83" font-size="16" font-weight="600">for help</text><text x="738" y="478" fill="#087F83" font-size="16" font-weight="600">compare</text><text x="738" y="500" fill="#087F83" font-size="16" font-weight="600">alternatives</text><rect x="60" y="210" width="285" height="165" rx="20" fill="#FFFFFF" stroke="#087F83" stroke-width="1.4"/><text x="80" y="241" fill="#087F83" font-size="13" font-weight="700" letter-spacing="1.3">FRAGMENT A</text><text x="80" y="280" fill="#173042" font-size="17">I stay curious, but I</text><text x="80" y="306" fill="#173042" font-size="17">check what changed</text><text x="80" y="332" fill="#173042" font-size="17">before changing methods.</text><rect x="570" y="210" width="285" height="165" rx="20" fill="#FFFFFF" stroke="#C9D6D9" stroke-width="1.4"/><text x="590" y="241" fill="#087F83" font-size="13" font-weight="700" letter-spacing="1.3">FRAGMENT B</text><text x="590" y="280" fill="#173042" font-size="17">A small check can reveal</text><text x="590" y="306" fill="#173042" font-size="17">whether source versions</text><text x="590" y="332" fill="#173042" font-size="17">were mixed.</text><rect x="1080" y="210" width="285" height="165" rx="20" fill="#FFFFFF" stroke="#C9D6D9" stroke-width="1.4"/><text x="1100" y="241" fill="#087F83" font-size="13" font-weight="700" letter-spacing="1.3">FRAGMENT C</text><text x="1100" y="280" fill="#173042" font-size="17">Rowan helped when I</text><text x="1100" y="306" fill="#173042" font-size="17">sent exact inputs and</text><text x="1100" y="332" fill="#173042" font-size="17">a focused question.</text><rect x="1080" y="615" width="285" height="165" rx="20" fill="#FFFFFF" stroke="#C9D6D9" stroke-width="1.4"/><text x="1100" y="646" fill="#087F83" font-size="13" font-weight="700" letter-spacing="1.3">FRAGMENT D</text><text x="1100" y="685" fill="#173042" font-size="17">The explanation did not</text><text x="1100" y="711" fill="#173042" font-size="17">fit here. The cause</text><text x="1100" y="737" fill="#173042" font-size="17">was rounding.</text><rect x="570" y="615" width="285" height="165" rx="20" fill="#FFFFFF" stroke="#C9D6D9" stroke-width="1.4"/><text x="590" y="646" fill="#087F83" font-size="13" font-weight="700" letter-spacing="1.3">FRAGMENT E</text><text x="590" y="685" fill="#173042" font-size="17">I compare provenance</text><text x="590" y="711" fill="#173042" font-size="17">and rounding before</text><text x="590" y="737" fill="#173042" font-size="17">asking for help.</text><rect x="60" y="615" width="285" height="165" rx="20" fill="#FFFFFF" stroke="#C9D6D9" stroke-width="1.4"/><text x="80" y="646" fill="#087F83" font-size="13" font-weight="700" letter-spacing="1.3">FRAGMENT F</text><text x="80" y="685" fill="#173042" font-size="17">I ask more clearly when</text><text x="80" y="711" fill="#173042" font-size="17">I explain what I have</text><text x="80" y="737" fill="#173042" font-size="17">already checked.</text><rect x="60" y="801" width="285" height="36" rx="18" fill="#E5F3EE" stroke="#E5F3EE" stroke-width="1.4"/><text x="202.5" y="825" fill="#087F83" font-size="14" font-weight="600" text-anchor="middle">A IS PINNED, NOT A ROOT</text><text x="570" y="826" fill="#526774" font-size="17">Illustrative fragments and conditions, not recorded experience.</text><rect x="60" y="854" width="1320" height="65" rx="16" fill="#E5F3EE" stroke="#E5F3EE" stroke-width="1.4"/><text x="720" y="894" fill="#173042" font-size="22" font-weight="600" text-anchor="middle">Connections recall information. They do not choose actions.</text></svg>
