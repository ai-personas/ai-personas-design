<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='1000' viewBox='0 0 1600 1000' role='img' aria-labelledby='title desc'>
<title id='title'>Embodiment is an accountable connection.</title><desc id='desc'>Seven functional embodiment layers: persistent, informational, cognitive, practical, temporal, social, and accountable. Digital embodiment is sufficient for many needs; physical interfaces are optional and need stronger safeguards. The vocabulary is proposed Extension E1, with physical safeguards in Extension E4.</desc>
<defs><style>.t0{font-size:18px;fill:#FFFFFF;font-weight:700;text-anchor:middle}.t1{font-size:25px;fill:#102D3C;font-weight:700}.t2{font-size:20px;fill:#526976}.t3{font-size:33px;fill:#FFFFFF;font-weight:700}.t4{font-size:28px;fill:#FFFFFF;font-weight:700;text-anchor:middle}.p0{fill:none;stroke:#CAD6D5;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}.p1{fill:none;stroke:#00786D;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.r0{fill:#FFFFFF;stroke:#CAD6D5;rx:8}.r1{fill:#234552;rx:8}</style><marker id='arrow' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto-start-reverse' markerUnits='userSpaceOnUse'><path d='M0 0 8 4 0 8Z' fill='#00786D'/></marker></defs>
<g font-family='Lato, Arial, sans-serif'>
<rect x='0' y='0' width='1600' height='1000' fill='#F7F5EF'/>
<text x='72' y='58' font-size='18' fill='#00786D' font-weight='700'>AI PERSONAS / DESIGN FIELD GUIDE</text>
<text x='1528' y='58' font-size='18' fill='#00786D' font-weight='700' text-anchor='end'>OVERVIEW / P05</text>
<path d='M72 85H1528' class='p0'/>
<text x='72' y='164' font-size='64' fill='#102D3C' font-weight='700'>Embodiment is an accountable connection.</text>
<text x='72' y='211' font-size='22' fill='#526976'>Identity, situation, choice, action, and consequence must stay connected through real, bounded work.</text>
<path d='M72 938H1528' class='p0'/>
<text x='72' y='966' font-size='15' fill='#526976' font-weight='700'>PROPOSED DESIGN / NOT IMPLEMENTATION EVIDENCE</text>
<text x='1528' y='966' font-size='15' fill='#526976' text-anchor='end'>§§ 3.5, 18  /  VISUAL EDITION 01</text>
<rect x='72' y='274' width='996' height='66' class='r0'/>
<circle cx='108' cy='307' r='20' fill='#00786D' stroke-width='1'/>
<text x='108' y='313' class='t0'>1</text>
<text x='144' y='315' class='t1'>Persistent</text>
<text x='370' y='314' class='t2'>Identity and state survive individual inference calls.</text>
<rect x='72' y='352' width='996' height='66' class='r0'/>
<circle cx='108' cy='385' r='20' fill='#00786D' stroke-width='1'/>
<text x='108' y='391' class='t0'>2</text>
<text x='144' y='393' class='t1'>Informational</text>
<text x='370' y='392' class='t2'>Observe authorized facts and retain their provenance.</text>
<rect x='72' y='430' width='996' height='66' class='r0'/>
<circle cx='108' cy='463' r='20' fill='#00786D' stroke-width='1'/>
<text x='108' y='469' class='t0'>3</text>
<text x='144' y='471' class='t1'>Cognitive</text>
<text x='370' y='470' class='t2'>Current obligations and relevant memory inform decisions.</text>
<rect x='72' y='508' width='996' height='66' class='r0'/>
<circle cx='108' cy='541' r='20' fill='#00786D' stroke-width='1'/>
<text x='108' y='547' class='t0'>4</text>
<text x='144' y='549' class='t1'>Practical</text>
<text x='370' y='548' class='t2'>Communicate or act through bounded capabilities.</text>
<rect x='72' y='586' width='996' height='66' class='r0'/>
<circle cx='108' cy='619' r='20' fill='#00786D' stroke-width='1'/>
<text x='108' y='625' class='t0'>5</text>
<text x='144' y='627' class='t1'>Temporal</text>
<text x='370' y='626' class='t2'>Distinguish waiting, running, changed, and completed.</text>
<rect x='72' y='664' width='996' height='66' class='r0'/>
<circle cx='108' cy='697' r='20' fill='#00786D' stroke-width='1'/>
<text x='108' y='703' class='t0'>6</text>
<text x='144' y='705' class='t1'>Social</text>
<text x='370' y='704' class='t2'>Record invitations, agreements, commitments, and handoffs.</text>
<rect x='72' y='742' width='996' height='66' class='r0'/>
<circle cx='108' cy='775' r='20' fill='#00786D' stroke-width='1'/>
<text x='108' y='781' class='t0'>7</text>
<text x='144' y='783' class='t1'>Accountable</text>
<text x='370' y='782' class='t2'>Link claims to evidence and responsibility to disposition.</text>
<rect x='1120' y='274' width='408' height='534' rx='10' fill='#102D3C'/>
<text x='1148' y='319' class='t3'>FUNCTIONAL,</text>
<text x='1148' y='359' class='t3'>NOT PHYSICAL.</text>
<text x='1148' y='405' font-size='20' fill='#D4E3E7'><tspan x='1148' dy='0'>Digital embodiment is sufficient.</tspan><tspan x='1148' dy='28'>Avatars and robots are optional.</tspan></text>
<rect x='1148' y='504' width='352' height='68' class='r1'/>
<text x='1324' y='548' class='t4'>Observe</text>
<rect x='1148' y='601' width='352' height='68' class='r1'/>
<text x='1324' y='645' class='t4'>Choose</text>
<rect x='1148' y='698' width='352' height='68' class='r1'/>
<text x='1324' y='742' class='t4'>Act + review</text>
<path d='M1324 578V595' marker-end='url(#arrow)' class='p1'/>
<path d='M1324 675V692' marker-end='url(#arrow)' class='p1'/>
<rect x='72' y='844' width='1456' height='94' rx='10' fill='#102D3C'/>
<text x='98' y='880' font-size='26' fill='#FFFFFF' font-weight='700'>A body, a portrait, or a rich profile is not enough.</text>
<text x='98' y='911' font-size='19' fill='#D4E3E7'>Physical effects require specific authority, reliable observation, human override, and deployment-specific assurance. E1 / E4.</text>
</g></svg>
