<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='1000' viewBox='0 0 1600 1000' role='img' aria-labelledby='title desc'>
<title id='title'>Three layers. One recurring event path.</title><desc id='desc'>Human need leads to versioned work and environment, then distinct continuing personas. Personas exchange shared proposals and commitments and private or explicitly shared fragments. They act through admission, resources, safe execution, and authorized capabilities. Artifacts and observations lead to review and release; both observations and review return to personas.</desc>
<defs><style>.t0{font-size:17px;fill:#526976}.t1{font-size:28px;fill:#173443;font-weight:700}.t2{font-size:19px;fill:#526976}.p0{fill:none;stroke:#CAD6D5;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}.p1{fill:none;stroke:#00786D;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.r0{fill:#E2F2EA;stroke:#00786D;rx:10}.r1{fill:#FFFFFF;stroke:#CAD6D5;rx:10}</style><marker id='arrow' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto-start-reverse' markerUnits='userSpaceOnUse'><path d='M0 0 8 4 0 8Z' fill='#00786D'/></marker></defs>
<g font-family='Lato, Arial, sans-serif'>
<rect x='0' y='0' width='1600' height='1000' fill='#F7F5EF'/>
<text x='72' y='58' font-size='18' fill='#00786D' font-weight='700'>AI PERSONAS / DESIGN FIELD GUIDE</text>
<text x='1528' y='58' font-size='18' fill='#00786D' font-weight='700' text-anchor='end'>SYSTEM DIAGRAM / D02</text>
<path d='M72 85H1528' class='p0'/>
<text x='72' y='164' font-size='64' fill='#102D3C' font-weight='700'>Three layers. One recurring event path.</text>
<text x='72' y='211' font-size='22' fill='#526976'>People authorize. Personas interpret. The supporting system carries out permitted work and records consequences.</text>
<path d='M72 938H1528' class='p0'/>
<text x='72' y='966' font-size='15' fill='#526976' font-weight='700'>PROPOSED DESIGN / NOT IMPLEMENTATION EVIDENCE</text>
<text x='1528' y='966' font-size='15' fill='#526976' text-anchor='end'>§ 4.3  /  VISUAL EDITION 01</text>
<path d='M492 329H600' marker-end='url(#arrow)' class='p1'/>
