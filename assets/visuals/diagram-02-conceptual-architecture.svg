<text x='1152' y='765' class='t1'>Authorized capabilities</text>
<text x='1152' y='805' class='t2'>Tools and outside participants.</text>
<rect x='600' y='734' width='420' height='110' class='r1'/>
<text x='622' y='765' class='t1'>Artifacts + observations</text>
<text x='622' y='805' class='t2'>Exact outputs, receipts, and evidence.</text>
<rect x='72' y='734' width='420' height='110' class='r1'/>
<text x='94' y='765' class='t1'>Review + release</text>
<text x='94' y='805' class='t2'>Assess, revise, and release honestly.</text>
<text x='72' y='908' class='t2'>Arrows show work and feedback. Double-headed links are exchanges—not unrestricted sharing or shared authority.</text>
