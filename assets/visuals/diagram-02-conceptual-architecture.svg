<rect x='954' y='861' width='252.9375' height='25' fill='#F7F5EF'/>
<text x='960' y='880' class='t0'>review informs fresh decisions</text>
<rect x='72' y='280' width='420' height='98' class='r0'/>
<text x='94' y='311' class='t1'>Human need + boundaries</text>
<text x='94' y='351' class='t2'>Purpose and authorized limits.</text>
<rect x='600' y='280' width='420' height='98' class='r1'/>
<text x='622' y='311' class='t1'>Work + environment</text>
<text x='622' y='351' class='t2'>Versioned mandate and context.</text>
<rect x='1130' y='280' width='398' height='98' rx='10' fill='#102D3C' stroke='#102D3C'/>
<text x='1152' y='311' font-size='28' fill='#FFFFFF' font-weight='700'>Continuing personas</text>
<text x='1152' y='351' font-size='19' fill='#D4E3E7'>Distinct perspectives and choices.</text>
<rect x='72' y='474' width='420' height='110' class='r1'/>
<text x='94' y='505' class='t1'>Shared work records</text>
<text x='94' y='545' class='t2'>Proposals, commitments, and agreements.</text>
<rect x='600' y='474' width='420' height='110' class='r1'/>
<text x='622' y='505' class='t1'>Fragments</text>
<text x='622' y='545' class='t2'>Private or explicitly shared memory.</text>
<rect x='1130' y='474' width='398' height='110' class='r0'/>
<text x='1152' y='505' class='t1'>Admission + execution</text>
<text x='1152' y='545' class='t2'>Resources, limits, and safe action.</text>
