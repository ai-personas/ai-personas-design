<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-labelledby="title desc"><title id="title">Large memory. Small context.</title><desc id="desc">Illustrative capacity settings show a large personal graph narrowed by indexed search to 24 candidate packets. An optional Jev batch asks at most two questions per candidate. The runtime assembles a final request from required current context, valid exact fragment selections, qualifications, and optional previews. Counts are experimental examples, not provider limits or measured performance.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#FCFBF7"/><stop offset="1" stop-color="#EDF4F2"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#087F83" stroke-width="1.6"/></marker></defs><rect width="1440" height="960" fill="url(#paper)"/><path d="M60 168H1380" stroke="#D3DFDD"/><text x="60" y="57" fill="#087F83" font-size="15" font-weight="700" letter-spacing="2">AI PERSONAS  /  DESIGN ATLAS  /  03</text><text x="60" y="113" fill="#173042" font-size="44" font-weight="700">Large memory. Small context.</text><text x="60" y="148" fill="#526774" font-size="20">Search first. Assess a shortlist. Keep exact text and its important qualifications.</text><text x="60" y="931" fill="#526774" font-size="13" font-weight="600" letter-spacing="1">DESIGN TARGET  •  NOT A LIVE PRODUCT TRACE</text><text x="1380" y="931" fill="#526774" font-size="13" font-weight="600" text-anchor="end" letter-spacing="1">FRAGMENT RECALL  /  03</text><rect x="60" y="200" width="710" height="36" rx="18" fill="#E5F3EE" stroke="#E5F3EE" stroke-width="1.4"/><text x="415.0" y="224" fill="#087F83" font-size="14" font-weight="600" text-anchor="middle">ILLUSTRATIVE SETTINGS — NOT PROVIDER LIMITS OR MEASURED PERFORMANCE</text><rect x="60" y="280" width="340" height="220" rx="20" fill="#FFFFFF" stroke="#C9D6D9" stroke-width="1.4"/><text x="84" y="314" fill="#087F83" font-size="13" font-weight="700" letter-spacing="1.5">STORED NETWORK</text><text x="84" y="357" fill="#173042" font-size="27" font-weight="700">10,000 fragments</text><text x="84" y="397.0" fill="#526774" font-size="19">The archive stays in storage.</text><text x="84" y="425.12" fill="#526774" font-size="19">Indexes find possible entries.</text><text x="84" y="453.24" fill="#526774" font-size="19">The model does not read it all.</text><rect x="550" y="280" width="340" height="220" rx="20" fill="#FFFFFF" stroke="#C9D6D9" stroke-width="1.4"/><text x="574" y="314" fill="#087F83" font-size="13" font-weight="700" letter-spacing="1.5">CANDIDATE DISCOVERY</text><text x="574" y="357" fill="#173042" font-size="27" font-weight="700">24 candidate packets</text><text x="574" y="397.0" fill="#526774" font-size="19">Current need and events.</text><text x="574" y="425.12" fill="#526774" font-size="19">Exact entities and text search.</text><text x="574" y="453.24" fill="#526774" font-size="19">Bounded graph connections.</text><rect x="1040" y="280" width="340" height="220" rx="20" fill="#EAF0FB" stroke="#C9D6D9" stroke-width="1.4"/><text x="1064" y="314" fill="#087F83" font-size="13" font-weight="700" letter-spacing="1.5">OPTIONAL ASSESSMENT</text><text x="1064" y="357" fill="#173042" font-size="27" font-weight="700">0 or 1 Jev batch</text><text x="1064" y="397.0" fill="#526774" font-size="19">Up to 48 independent</text><text x="1064" y="425.12" fill="#526774" font-size="19">questions in this example.</text><text x="1064" y="453.24" fill="#526774" font-size="19">Relevance is not truth.</text><path d="M408 390H538" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M898 390H1028" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1210 500V608" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1230" y="561" fill="#526774" font-size="16">Valid assessments</text><rect x="60" y="620" width="340" height="185" rx="20" fill="#E5F3EE" stroke="#C9D6D9" stroke-width="1.4"/><text x="84" y="654" fill="#087F83" font-size="13" font-weight="700" letter-spacing="1.5">PROTECTED INPUT</text><text x="84" y="697" fill="#173042" font-size="27" font-weight="700">Current context</text><text x="84" y="737.0" fill="#526774" font-size="19">Character, task, obligations,</text><text x="84" y="765.12" fill="#526774" font-size="19">and important observations.</text><path d="M409 714H538" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="550" y="620" width="830" height="185" rx="20" fill="#FFFFFF" stroke="#C9D6D9" stroke-width="1.4"/><text x="579" y="657" fill="#087F83" font-size="14" font-weight="700" letter-spacing="1.4">RUNTIME CONTEXT COMPILER</text><text x="579" y="702" fill="#173042" font-size="31" font-weight="700">A coherent, bounded request</text><text x="579" y="742" fill="#526774" font-size="20">Required context + exact selected text + material qualifiers.</text><text x="579" y="773" fill="#526774" font-size="20">Optional previews use only the remaining allowance.</text><rect x="60" y="839" width="1320" height="65" rx="16" fill="#E5F3EE" stroke="#E5F3EE" stroke-width="1.4"/><text x="720" y="879" fill="#173042" font-size="22" font-weight="600" text-anchor="middle">No all-graph prompt. No separate generative memory writer.</text></svg>
