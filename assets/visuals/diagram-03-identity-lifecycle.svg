<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='1000' viewBox='0 0 1600 1000' role='img' aria-labelledby='title desc'>
<title id='title'>Work ends. Identity can continue.</title><desc id='desc'>Initialization becomes Active after bounded orientation, or Dormant if it cannot continue. Active becomes Dormant when paused or not participating; Dormant becomes Active only on authorized resumption. Active becomes Retired after obligations receive a disposition; Dormant becomes Retired by an authorized lifecycle decision. Quarantine is a separate restriction and is not a lifecycle transition in this diagram.</desc>
<defs><style>.t0{font-size:17px;fill:#526976}.t1{font-size:19px;fill:#526976}.t2{font-size:36px;fill:#173443;font-weight:700}.p0{fill:none;stroke:#CAD6D5;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}.p1{fill:none;stroke:#00786D;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.r0{fill:#F7F5EF}.r1{fill:#FFFFFF;stroke:#CAD6D5;rx:10}</style><marker id='arrow' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto-start-reverse' markerUnits='userSpaceOnUse'><path d='M0 0 8 4 0 8Z' fill='#00786D'/></marker></defs>
<g font-family='Lato, Arial, sans-serif'>
<rect x='0' y='0' width='1600' height='1000' class='r0'/>
<text x='72' y='58' font-size='18' fill='#00786D' font-weight='700'>AI PERSONAS / DESIGN FIELD GUIDE</text>
<text x='1528' y='58' font-size='18' fill='#00786D' font-weight='700' text-anchor='end'>SYSTEM DIAGRAM / D03</text>
<path d='M72 85H1528' class='p0'/>
<text x='72' y='164' font-size='64' fill='#102D3C' font-weight='700'>Work ends. Identity can continue.</text>
<text x='72' y='211' font-size='22' fill='#526976'>Lifecycle state is separate from project participation, funding episodes, competence, and security restrictions.</text>
<path d='M72 938H1528' class='p0'/>
<text x='72' y='966' font-size='15' fill='#526976' font-weight='700'>PROPOSED DESIGN / NOT IMPLEMENTATION EVIDENCE</text>
<text x='1528' y='966' font-size='15' fill='#526976' text-anchor='end'>§ 5.3  /  VISUAL EDITION 01</text>
<circle cx='108' cy='495' r='10' fill='#102D3C' stroke-width='1'/>
<path d='M118 495H190' marker-end='url(#arrow)' class='p1'/>
<path d='M520 465H565V370H640' marker-end='url(#arrow)' class='p1'/>
<rect x='210' y='342' width='261.53125' height='25' class='r0'/>
<text x='216' y='361' class='t0'>bounded orientation completes</text>
<path d='M520 525H565V720H640' marker-end='url(#arrow)' class='p1'/>
<rect x='243' y='735' width='243.5' height='25' class='r0'/>
<text x='249' y='754' class='t0'>initialization cannot continue</text>
<path d='M716 440V650' marker-end='url(#arrow)' class='p1'/>
<rect x='731' y='511' width='172' height='25' class='r0'/>
<text x='737' y='530' class='t0'><tspan x='737' dy='0'>pause / no</tspan><tspan x='737' dy='22'>participation</tspan></text>
<path d='M936 650V440' marker-end='url(#arrow)' class='p1'/>
<rect x='944' y='532' width='172' height='25' class='r0'/>
<text x='950' y='551' class='t0'><tspan x='950' dy='0'>authorized</tspan><tspan x='950' dy='22'>resumption</tspan></text>
<path d='M1010 370H1120V500H1160' marker-end='url(#arrow)' class='p1'/>
<rect x='1129' y='393' width='272' height='25' class='r0'/>
<text x='1135' y='412' class='t0'>obligations disposed</text>
<path d='M1010 720H1120V590H1160' marker-end='url(#arrow)' class='p1'/>
<rect x='1034' y='733' width='282' height='25' class='r0'/>
<text x='1040' y='752' class='t0'>authorized lifecycle decision</text>
<path d='M1342 625V784H1447' marker-end='url(#arrow)' class='p1'/>
<circle cx='1464' cy='784' r='15' fill='none' stroke='#102D3C' stroke-width='2'/>
<circle cx='1464' cy='784' r='9' fill='#102D3C' stroke-width='1'/>
<rect x='190' y='420' width='330' height='150' class='r1'/>
<text x='212' y='451' font-size='31' fill='#173443' font-weight='700'>Initializing</text>
<text x='212' y='495' class='t1'><tspan x='212' dy='0'>Identity exists. Orientation and</tspan><tspan x='212' dy='25'>access remain bounded.</tspan></text>
<rect x='640' y='300' width='370' height='140' rx='10' fill='#E2F2EA' stroke='#00786D'/>
<text x='662' y='331' class='t2'>Active</text>
<text x='662' y='380' class='t1'><tspan x='662' dy='0'>Eligible for authorized work; no idle</tspan><tspan x='662' dy='25'>inference.</tspan></text>
<rect x='640' y='650' width='370' height='140' class='r1'/>
<text x='662' y='681' class='t2'>Dormant</text>
<text x='662' y='730' class='t1'><tspan x='662' dy='0'>Identity persists without ongoing</tspan><tspan x='662' dy='25'>model calls.</tspan></text>
<rect x='1160' y='465' width='368' height='160' rx='10' fill='#102D3C' stroke='#102D3C'/>
<text x='1182' y='496' font-size='36' fill='#FFFFFF' font-weight='700'>Retired</text>
<text x='1182' y='545' font-size='19' fill='#D4E3E7'><tspan x='1182' dy='0'>No new participation under the</tspan><tspan x='1182' dy='25'>current disposition.</tspan></text>
<text x='72' y='908' class='t1'>Quarantine is an independent security restriction. Handoff, cancellation, or an explicit block must account for open obligations.</text>
</g></svg>
