<text x='556' y='779' class='t1'>Use or acquire sufficient capabilities</text>
<rect x='534' y='826' width='420' height='68' class='r1'/>
<text x='556' y='857' class='t1'><tspan x='556' dy='0'>Perform bounded work on declared</tspan><tspan x='556' dy='25'>inputs</tspan></text>
