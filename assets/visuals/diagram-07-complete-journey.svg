<title id='title'>Make progress. Keep the return paths visible.</title><desc id='desc'>The main path preserves need, accepts continuation, interprets criteria, surfaces agendas, accepts commitments, establishes capabilities, performs work, inspects evidence, reviews, checks currentness, delivers, retains lessons and settles participation, and continues only on a new need or authorized ongoing event. Side branches cover absent acceptance, missing information, justified recruitment, honest stopping, repair, changed state, and returns to interpretation.</desc>
<defs><style>.t0{font-size:22px;fill:#FFFFFF;font-weight:700}.t1{font-size:22px;fill:#173443;font-weight:700}.t2{font-size:17px;fill:#526976}.t3{font-size:26px;fill:#173443;font-weight:700}.t4{font-size:19px;fill:#526976}.t5{font-size:25px;fill:#173443;font-weight:700}.t6{font-size:15px;fill:#FFFFFF;font-weight:700;text-anchor:middle}.p0{fill:none;stroke:#CAD6D5;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}.p1{fill:none;stroke:#00786D;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.r0{fill:#102D3C;stroke:#102D3C;rx:10}.r1{fill:#FFFFFF;stroke:#CAD6D5;rx:10}.r2{fill:#FFF0D8;stroke:#D8BA8F;rx:10}.r3{fill:#E2F2EA;stroke:#00786D;rx:10}</style><marker id='arrow' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto-start-reverse' markerUnits='userSpaceOnUse'><path d='M0 0 8 4 0 8Z' fill='#00786D'/></marker></defs>
