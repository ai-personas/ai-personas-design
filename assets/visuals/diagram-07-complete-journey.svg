<path d='M72 85H1528' class='p0'/>
<text x='72' y='164' font-size='64' fill='#102D3C' font-weight='700'>Make progress. Keep the return paths visible.</text>
<text x='72' y='211' font-size='22' fill='#526976'>A complete reading map with explicit gates, exceptions, and numbered returns—not a workflow engine.</text>
<path d='M72 1438H1528' class='p0'/>
