<text x='556' y='545' class='t1'><tspan x='556' dy='0'>Interpret outcomes, unknowns,</tspan><tspan x='556' dy='25'>criteria</tspan></text>
<rect x='534' y='592' width='420' height='68' class='r1'/>
<text x='556' y='623' class='t1'><tspan x='556' dy='0'>Individual agendas + shared</tspan><tspan x='556' dy='25'>opportunities</tspan></text>
