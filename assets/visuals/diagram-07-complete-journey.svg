<rect x='534' y='982' width='420' height='68' class='r1'/>
<text x='556' y='1013' class='t1'><tspan x='556' dy='0'>Review exact candidate + scope</tspan><tspan x='556' dy='25'>coverage</tspan></text>
<rect x='534' y='1060' width='420' height='68' class='r2'/>
<text x='556' y='1091' class='t1'>Check currentness + seal release</text>
<rect x='534' y='1138' width='420' height='68' class='r0'/>
<text x='556' y='1169' class='t0'>Deliver result, limits, open obligations</text>
<rect x='534' y='1216' width='420' height='68' class='r1'/>
<text x='556' y='1247' class='t1'><tspan x='556' dy='0'>Retain useful lessons + settle</tspan><tspan x='556' dy='25'>participation</tspan></text>
<rect x='534' y='1294' width='420' height='68' class='r1'/>
<text x='556' y='1325' class='t1'><tspan x='556' dy='0'>Next need or authorized ongoing</tspan><tspan x='556' dy='25'>event</tspan></text>
