<path d='M960 930H850' marker-end='url(#arrow)' class='p1'/>
<path d='M550 930H412' marker-end='url(#arrow)' class='p1'/>
<rect x='1270' y='295' width='50.359375' height='25' class='r0'/>
<text x='1276' y='314' class='t0'>No</text>
