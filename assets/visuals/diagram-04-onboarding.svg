<text x='440' y='518' class='t0'>No</text>
<rect x='706' y='627' width='53.078125' height='25' class='r0'/>
<text x='712' y='646' class='t0'>Yes</text>
<rect x='1274' y='688' width='50.359375' height='25' class='r0'/>
<text x='1280' y='707' class='t0'>No</text>
<rect x='1117' y='824' width='53.078125' height='25' class='r0'/>
<text x='1123' y='843' class='t0'>Yes</text>
<rect x='72' y='280' width='320' height='100' class='r1'/>
<text x='94' y='311' class='t1'>Contribution gap</text>
<text x='94' y='349' class='t2'>Observe the need for help.</text>
<rect x='465' y='280' width='360' height='100' class='r1'/>
<text x='487' y='311' class='t1'>Propose help</text>
<text x='487' y='349' class='t2'>Birth or recruit—not automatic.</text>
<rect x='960' y='280' width='300' height='110' class='r2'/>
<text x='982' y='311' class='t1'><tspan x='982' dy='0'>Authority +</tspan><tspan x='982' dy='29'>resources?</tspan></text>
<text x='982' y='378' class='t2'>Admission gate.</text>
<rect x='1320' y='280' width='208' height='110' class='r1'/>
<text x='1342' y='311' class='t3'>Refuse / block</text>
<text x='1342' y='346' class='t2'><tspan x='1342' dy='0'>Make the reason</tspan><tspan x='1342' dy='25'>visible.</tspan></text>
<rect x='960' y='480' width='300' height='110' class='r1'/>
<text x='982' y='511' class='t4'>Restricted orientation</text>
<text x='982' y='547' class='t2'>Preview invitation and terms.</text>
<rect x='550' y='480' width='300' height='110' class='r2'/>
<text x='572' y='511' class='t5'>Accept membership?</text>
<text x='572' y='548' class='t2'>A separate decision.</text>
<rect x='72' y='480' width='340' height='110' class='r1'/>
<text x='94' y='511' class='t1'>Decline recorded</text>
<text x='94' y='549' class='t2'>Reconcile unused reservation.</text>
<rect x='550' y='680' width='300' height='100' rx='10' fill='#E2F2EA' stroke='#00786D'/>
<text x='572' y='711' class='t5'>Scoped membership</text>
<text x='572' y='748' class='t2'>No automatic obligation.</text>
<rect x='960' y='680' width='300' height='110' class='r2'/>
<text x='982' y='711' class='t5'>Accept commitment?</text>
<text x='982' y='748' class='t2'>Specific offered terms.</text>
<rect x='1320' y='680' width='208' height='110' class='r1'/>
<text x='1342' y='711' class='t3'>Revise offer</text>
<text x='1342' y='746' class='t2'><tspan x='1342' dy='0'>Or leave visibly</tspan><tspan x='1342' dy='25'>unowned.</tspan></text>
<rect x='960' y='880' width='300' height='100' rx='10' fill='#102D3C' stroke='#102D3C'/>
<text x='982' y='911' font-size='27' fill='#FFFFFF' font-weight='700'>Accepted work</text>
<text x='982' y='950' font-size='19' fill='#D4E3E7'>Act under responsibility.</text>
<rect x='550' y='880' width='300' height='100' class='r1'/>
<text x='572' y='911' class='t4'>Contribution + review</text>
<text x='572' y='947' class='t2'>Inspect actual usefulness.</text>
<rect x='72' y='880' width='340' height='100' class='r1'/>
<text x='94' y='911' class='t1'>Explicit disposition</text>
<text x='94' y='949' class='t2'>Continue, dormant, or handoff.</text>
<text x='72' y='1008' class='t2'>AI acceptance is an operational protocol—not a claim of human-like subjective consent. Human consent remains separately required.</text>
</g></svg>
