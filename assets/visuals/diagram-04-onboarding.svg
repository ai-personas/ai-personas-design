<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='1100' viewBox='0 0 1600 1100' role='img' aria-labelledby='title desc'>
<title id='title'>Creation is not membership. Membership is not work.</title><desc id='desc'>A contribution gap motivates a birth or recruitment proposal. Failed authority/resources lead to a visible refusal or block. Otherwise restricted orientation precedes a membership decision. Declining records the decision and reconciles unused reservation. Accepted scoped membership precedes a separate commitment decision: negotiate/decline leaves a revised or unowned offer; acceptance leads to work, actual contribution and review, then continuing, dormancy, or handoff.</desc>
<defs><style>.t0{font-size:17px;fill:#526976}.t1{font-size:26px;fill:#173443;font-weight:700}.t2{font-size:19px;fill:#526976}.t3{font-size:23px;fill:#173443;font-weight:700}.t4{font-size:24px;fill:#173443;font-weight:700}.t5{font-size:25px;fill:#173443;font-weight:700}.p0{fill:none;stroke:#CAD6D5;stroke-width:1;stroke-linejoin:round;stroke-linecap:round}.p1{fill:none;stroke:#00786D;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.r0{fill:#F7F5EF}.r1{fill:#FFFFFF;stroke:#CAD6D5;rx:10}.r2{fill:#FFF0D8;stroke:#D8BA8F;rx:10}</style><marker id='arrow' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto-start-reverse' markerUnits='userSpaceOnUse'><path d='M0 0 8 4 0 8Z' fill='#00786D'/></marker></defs>
<g font-family='Lato, Arial, sans-serif'>
<rect x='0' y='0' width='1600' height='1100' class='r0'/>
<text x='72' y='58' font-size='18' fill='#00786D' font-weight='700'>AI PERSONAS / DESIGN FIELD GUIDE</text>
<text x='1528' y='58' font-size='18' fill='#00786D' font-weight='700' text-anchor='end'>SYSTEM DIAGRAM / D04</text>
<path d='M72 85H1528' class='p0'/>
<text x='72' y='164' font-size='61' fill='#102D3C' font-weight='700'>Creation is not membership. Membership is not work.</text>
<text x='72' y='211' font-size='22' fill='#526976'>Keep authority, scoped invitation acceptance, and accepted responsibility as separate decisions.</text>
<path d='M72 1038H1528' class='p0'/>
<text x='72' y='1066' font-size='15' fill='#526976' font-weight='700'>PROPOSED DESIGN / NOT IMPLEMENTATION EVIDENCE</text>
<text x='1528' y='1066' font-size='15' fill='#526976' text-anchor='end'>§ 6.5  /  VISUAL EDITION 01</text>
<path d='M392 330H465' marker-end='url(#arrow)' class='p1'/>
