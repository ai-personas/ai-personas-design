<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" font-family="DejaVu Sans, Arial, sans-serif" role="img" aria-labelledby="title desc"><title id="title">One persona. Two model roles.</title><desc id="desc">A new task, reply, or result seeds indexed retrieval in the personal fragment graph. A bounded shortlist may be assessed by Jev. The runtime combines valid recommendations with required current context before the persona LLM performs work and authors updates in one response. Accepted updates return to the graph. A declared local fallback bypasses the selector. Every boundary retains permission, version, and funding checks.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#FCFBF7"/><stop offset="1" stop-color="#EDF4F2"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#087F83" stroke-width="1.6"/></marker></defs><rect width="1440" height="960" fill="url(#paper)"/><path d="M60 168H1380" stroke="#D3DFDD"/><text x="60" y="57" fill="#087F83" font-size="15" font-weight="700" letter-spacing="2">AI PERSONAS  /  DESIGN ATLAS  /  01</text><text x="60" y="113" fill="#173042" font-size="44" font-weight="700">One persona. Two model roles.</text><text x="60" y="148" fill="#526774" font-size="20">The main LLM authors. An optional fast model helps recall.</text><text x="60" y="931" fill="#526774" font-size="13" font-weight="600" letter-spacing="1">DESIGN TARGET  •  NOT A LIVE PRODUCT TRACE</text><text x="1380" y="931" fill="#526774" font-size="13" font-weight="600" text-anchor="end" letter-spacing="1">FRAGMENT RECALL  /  01</text><rect x="60" y="214" width="300" height="36" rx="18" fill="#E5F3EE" stroke="#E5F3EE" stroke-width="1.4"/><text x="210.0" y="238" fill="#087F83" font-size="14" font-weight="600" text-anchor="middle">NEW TASK, REPLY OR RESULT</text><path d="M210 250V292" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="740" y="214" width="300" height="36" rx="18" fill="#E5F3EE" stroke="#E5F3EE" stroke-width="1.4"/><text x="890.0" y="238" fill="#087F83" font-size="14" font-weight="600" text-anchor="middle">REQUIRED CURRENT CONTEXT</text><path d="M890 250V292" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="300" width="300" height="245" rx="20" fill="#FFFFFF" stroke="#C9D6D9" stroke-width="1.4"/><text x="84" y="334" fill="#087F83" font-size="13" font-weight="700" letter-spacing="1.5">01  /  DISCOVER</text><text x="84" y="377" fill="#173042" font-size="27" font-weight="700">Indexed graph</text><text x="84" y="417.0" fill="#526774" font-size="19">Find permitted fragments</text><text x="84" y="445.12" fill="#526774" font-size="19">and relevant connections.</text><text x="84" y="473.24" fill="#526774" font-size="19">Return a bounded shortlist.</text><rect x="400" y="300" width="300" height="245" rx="20" fill="#EAF0FB" stroke="#C9D6D9" stroke-width="1.4"/><text x="424" y="334" fill="#087F83" font-size="13" font-weight="700" letter-spacing="1.5">02  /  OPTIONAL</text><text x="424" y="377" fill="#173042" font-size="27" font-weight="700">Jev selector</text><text x="424" y="417.0" fill="#526774" font-size="19">Assess relevance and</text><text x="424" y="445.12" fill="#526774" font-size="19">situation fit.</text><text x="424" y="473.24" fill="#526774" font-size="19">Do not write memory.</text><rect x="740" y="300" width="300" height="245" rx="20" fill="#FFFFFF" stroke="#C9D6D9" stroke-width="1.4"/><text x="764" y="334" fill="#087F83" font-size="13" font-weight="700" letter-spacing="1.5">03  /  COMPILE</text><text x="764" y="377" fill="#173042" font-size="27" font-weight="700">Checked context</text><text x="764" y="417.0" fill="#526774" font-size="19">Exact text and qualifiers.</text><text x="764" y="445.12" fill="#526774" font-size="19">Current character and</text><text x="764" y="473.24" fill="#526774" font-size="19">obligations stay protected.</text><rect x="1080" y="300" width="300" height="245" rx="20" fill="#E5F3EE" stroke="#C9D6D9" stroke-width="1.4"/><text x="1104" y="334" fill="#087F83" font-size="13" font-weight="700" letter-spacing="1.5">04  /  AUTHOR</text><text x="1104" y="377" fill="#173042" font-size="27" font-weight="700">Persona LLM</text><text x="1104" y="417.0" fill="#526774" font-size="19">Do useful work.</text><text x="1104" y="445.12" fill="#526774" font-size="19">Author fragment changes</text><text x="1104" y="473.24" fill="#526774" font-size="19">in the same response.</text><path d="M364 420H392" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M704 420H732" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1044 420H1072" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M270 545V603H890V552" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="580" y="639" fill="#526774" font-size="18" text-anchor="middle">Selector off or failed: declared local fallback</text><path d="M1230 545V754H150V552" fill="none" stroke="#087F83" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="420" y="736" width="660" height="36" rx="18" fill="#E5F3EE" stroke="#E5F3EE" stroke-width="1.4"/><text x="750.0" y="760" fill="#087F83" font-size="14" font-weight="600" text-anchor="middle">ACCEPTED FRAGMENT + CONNECTION + NEXT-CONTEXT UPDATES</text><rect x="60" y="833" width="1320" height="65" rx="16" fill="#E5F3EE" stroke="#E5F3EE" stroke-width="1.4"/><text x="720" y="873" fill="#173042" font-size="22" font-weight="600" text-anchor="middle">Runtime checks: ownership  ·  current versions  ·  processing permission  ·  funding</text></svg>
