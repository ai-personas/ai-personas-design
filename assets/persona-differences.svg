<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1860" viewBox="0 0 560 1860" role="img" aria-labelledby="title description">
  <title id="title">Same need, different approaches</title>
  <desc id="description">Two hypothetical personas choose different approaches to a workshop while keeping the actual task and factual evidence clear. Expressive cartoon characters and concrete artifacts illustrate the mechanism; this is a hypothetical teaching scene.</desc>
  <rect width="560" height="1860" fill="#fffaf0"/>
  <g font-family="Liberation Sans, Arial, sans-serif">
    <text x="28" y="55" font-size="27" fill="#16332f" font-weight="700"><tspan x="28" dy="0">Same need, different</tspan><tspan x="28" dy="36">approaches</tspan></text>
    <text x="28" y="129" font-size="17" fill="#00665f" font-weight="700"><tspan x="28" dy="0">AN ILLUSTRATED DESIGN STORY</tspan></text>
    <rect x="20" y="153" width="520" height="330" rx="20" fill="#e5f4ed" stroke="#d0d5cb" stroke-width="1"/>
    <rect x="34" y="171" width="233" height="85" rx="20" fill="#ffffff" stroke="#00665f" stroke-width="3"/>
    <path d="M59 254 L62 276 L84 254" stroke="#00665f" stroke-width="3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <text x="49" y="202" font-size="21" fill="#00665f" font-weight="700"><tspan x="49" dy="0">Who might be</tspan><tspan x="49" dy="30">left out?</tspan></text>
    <rect x="291" y="171" width="233" height="85" rx="20" fill="#ffffff" stroke="#245599" stroke-width="3"/>
    <path d="M479 254 L482 276 L504 254" stroke="#245599" stroke-width="3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <text x="306" y="202" font-size="21" fill="#245599" font-weight="700"><tspan x="306" dy="0">Let’s try two</tspan><tspan x="306" dy="30">formats.</tspan></text>
    <g transform="translate(120 371) scale(1)">
      <ellipse cx="0" cy="74" rx="47" ry="7" fill="#d8dfd5" stroke="none" stroke-width="3"/>
      <path d="M-30 63 Q-31 15 0 13 Q31 15 30 63 Z" stroke="#16332f" stroke-width="3" fill="#00665f" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-13 61 L-16 76 M13 61 L18 76" stroke="#16332f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-24 30 Q-45 41 -54 24 M24 30 Q44 25 50 9" stroke="#16332f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <ellipse cx="0" cy="-10" rx="32" ry="35" fill="#f5d9ae" stroke="#16332f" stroke-width="3"/>
      <path d="M-28 -20 Q-14 -58 0 -35 Q16 -60 28 -20" stroke="#16332f" stroke-width="3" fill="#00665f" stroke-linecap="round" stroke-linejoin="round" />
      <ellipse cx="-10" cy="-12" rx="3" ry="4" fill="#16332f" stroke="none" stroke-width="3"/>
      <ellipse cx="11" cy="-12" rx="3" ry="4" fill="#16332f" stroke="none" stroke-width="3"/>
      <path d="M-17 -20 L-7 -22 M7 -22 L17 -20" stroke="#16332f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-7 9 L9 9" stroke="#16332f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <g transform="translate(439 371) scale(1)">
      <ellipse cx="0" cy="74" rx="47" ry="7" fill="#d8dfd5" stroke="none" stroke-width="3"/>
      <path d="M-30 63 Q-31 15 0 13 Q31 15 30 63 Z" stroke="#16332f" stroke-width="3" fill="#245599" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-13 61 L-16 76 M13 61 L18 76" stroke="#16332f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-24 30 Q-45 41 -54 24 M24 30 Q44 25 50 9" stroke="#16332f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <ellipse cx="0" cy="-10" rx="32" ry="35" fill="#b9dce5" stroke="#16332f" stroke-width="3"/>
      <path d="M-29 -25 Q-2 -57 30 -23 L17 -28 L8 -37 L-6 -27 Z" stroke="#16332f" stroke-width="3" fill="#245599" stroke-linecap="round" stroke-linejoin="round" />
      <ellipse cx="-10" cy="-12" rx="3" ry="4" fill="#16332f" stroke="none" stroke-width="3"/>
      <ellipse cx="11" cy="-12" rx="3" ry="4" fill="#16332f" stroke="none" stroke-width="3"/>
      <path d="M-10 5 Q0 18 13 4" stroke="#16332f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <path d="M239 327 L302 327 L316 341 L314 401 L235 398 Z" stroke="#885000" stroke-width="3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M302 327 V342 H316" stroke="#885000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M247 352 H304" stroke="#885000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M247 364 H304" stroke="#885000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M247 376 H304" stroke="#885000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="221" y="428" font-size="19" fill="#885000" font-weight="700"><tspan x="221" dy="0">Workshop</tspan></text>
    <path d="M28 505 L529 503 L525 589 L32 587 Z" stroke="#00665f" stroke-width="2" fill="#00665f" stroke-linecap="round" stroke-linejoin="round" />
    <text x="47" y="535" font-size="22" fill="#ffffff" font-weight="700"><tspan x="47" dy="0">Hypothetical shared need: plan a</tspan><tspan x="47" dy="31">workshop</tspan></text>
    <path d="M29 613 L529 611 L531 924 L27 927 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="621" width="486" height="116" rx="16" fill="#e5f4ed" stroke="none" stroke-width="0"/>
    <ellipse cx="76" cy="645" rx="20" ry="21" fill="#f5d9ae" stroke="#00665f" stroke-width="2"/>
    <ellipse cx="70" cy="642" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="83" cy="642" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M71 653 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="112" y="653" font-size="23" fill="#00665f" font-weight="700"><tspan x="112" dy="0">Persona A: careful and</tspan><tspan x="112" dy="32">methodical</tspan></text>
    <text x="50" y="770" font-size="22" fill="#16332f"><tspan x="50" dy="0">Fragment: “I make uncertainty visible</tspan><tspan x="50" dy="31">before committing people.”</tspan><tspan x="50" dy="31">Approach: check access, capacity and</tspan><tspan x="50" dy="31">cost; ask what would make the plan</tspan><tspan x="50" dy="31">impractical.</tspan></text>
    <path d="M29 951 L529 949 L531 1262 L27 1265 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="959" width="486" height="116" rx="16" fill="#e8effb" stroke="none" stroke-width="0"/>
    <ellipse cx="486" cy="983" rx="20" ry="21" fill="#b9dce5" stroke="#245599" stroke-width="2"/>
    <ellipse cx="480" cy="980" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="493" cy="980" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M481 991 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="49" y="991" font-size="23" fill="#245599" font-weight="700"><tspan x="49" dy="0">Persona B: exploratory and</tspan><tspan x="49" dy="32">sociable</tspan></text>
    <text x="50" y="1108" font-size="22" fill="#16332f"><tspan x="50" dy="0">Fragment: “I help people discover</tspan><tspan x="50" dy="31">options together.”</tspan><tspan x="50" dy="31">Approach: offer two formats, invite</tspan><tspan x="50" dy="31">preferences and propose a small</tspan><tspan x="50" dy="31">rehearsal.</tspan></text>
    <path d="M29 1289 L529 1287 L531 1569 L27 1572 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="1297" width="486" height="116" rx="16" fill="#fff0cd" stroke="none" stroke-width="0"/>
    <ellipse cx="76" cy="1321" rx="20" ry="21" fill="#f5d9ae" stroke="#885000" stroke-width="2"/>
    <ellipse cx="70" cy="1318" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="83" cy="1318" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M71 1329 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="112" y="1329" font-size="23" fill="#885000" font-weight="700"><tspan x="112" dy="0">The same task and facts</tspan></text>
    <text x="50" y="1446" font-size="22" fill="#16332f"><tspan x="50" dy="0">Both need accurate facts and a</tspan><tspan x="50" dy="31">workable plan.</tspan><tspan x="50" dy="31">Neither invents a booking, expertise or a</tspan><tspan x="50" dy="31">participant’s agreement.</tspan></text>
    <path d="M29 1594 L531 1592 L527 1734 L32 1732 Z" stroke="#885000" stroke-width="1.5" fill="#fff0cd" stroke-linecap="round" stroke-linejoin="round" />
    <text x="46" y="1622" font-size="20" fill="#16332f"><tspan x="46" dy="0">Meaningful difference appears in attention,</tspan><tspan x="46" dy="29">choices and collaboration—not just a rewritten</tspan><tspan x="46" dy="29">tone. Neither approach is guaranteed better.</tspan></text>
    <text x="30" y="1769" font-size="19" fill="#405d58"><tspan x="30" dy="0">Characters personify design choices; they do not</tspan><tspan x="30" dy="28">assert feelings or consciousness. Scenes are</tspan><tspan x="30" dy="28">hypothetical.</tspan></text>
  </g>
</svg>
