<svg xmlns="http://www.w3.org/2000/svg" width="560" height="2005" viewBox="0 0 560 2005" role="img" aria-labelledby="title description">
  <title id="title">A local stop is not the end of a goal</title>
  <desc id="description">Unfinished accepted work preserves responsibility, durable state and the persona&#x27;s continuation choice. A fresh decision uses current facts and respects Stop or Pause; a queue alone does not establish another invocation. Expressive cartoon characters and concrete artifacts illustrate the mechanism; this is a hypothetical teaching scene.</desc>
  <rect width="560" height="2005" fill="#fffaf0"/>
  <g font-family="Liberation Sans, Arial, sans-serif">
    <text x="28" y="55" font-size="27" fill="#16332f" font-weight="700"><tspan x="28" dy="0">A local stop is not the end of a</tspan><tspan x="28" dy="36">goal</tspan></text>
    <text x="28" y="129" font-size="17" fill="#00665f" font-weight="700"><tspan x="28" dy="0">AN ILLUSTRATED DESIGN STORY</tspan></text>
    <rect x="20" y="153" width="520" height="330" rx="20" fill="#e8effb" stroke="#d0d5cb" stroke-width="1"/>
    <rect x="34" y="168" width="490" height="87" rx="20" fill="#ffffff" stroke="#00665f" stroke-width="3"/>
    <path d="M59 253 L62 275 L84 253" stroke="#00665f" stroke-width="3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <text x="49" y="200" font-size="22" fill="#00665f" font-weight="700"><tspan x="49" dy="0">Pause the process; preserve the</tspan><tspan x="49" dy="31">responsibility.</tspan></text>
