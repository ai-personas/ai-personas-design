    <path d="M252 323 V403" stroke="#245599" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M267 350 H304 M267 362 H299" stroke="#245599" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="230" y="435" font-size="20" fill="#245599" font-weight="700"><tspan x="230" dy="0">Work</tspan><tspan x="230" dy="29">state</tspan></text>
    <path d="M244 322 v39 l7 -8 l7 8 v-39" stroke="#aa3d55" stroke-width="2" fill="#f8e8ec" stroke-linecap="round" stroke-linejoin="round" />
