    <ellipse cx="83" cy="534" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M71 545 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="112" y="545" font-size="23" fill="#00665f" font-weight="700"><tspan x="112" dy="0">Accepted goal is still</tspan><tspan x="112" dy="32">unfinished</tspan></text>
    <text x="50" y="662" font-size="22" fill="#16332f"><tspan x="50" dy="0">A local yield, partial delivery or process</tspan><tspan x="50" dy="31">restart does not silently end</tspan><tspan x="50" dy="31">responsibility.</tspan></text>
    <path d="M260 764 Q292 768 280 787" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M273 780 L280 789 L288 780" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M29 801 L529 799 L531 1049 L27 1052 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="809" width="486" height="84" rx="16" fill="#fff0cd" stroke="none" stroke-width="0"/>
    <ellipse cx="486" cy="833" rx="20" ry="21" fill="#b9dce5" stroke="#00665f" stroke-width="2"/>
    <ellipse cx="480" cy="830" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="493" cy="830" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M481 841 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="49" y="841" font-size="23" fill="#00665f" font-weight="700"><tspan x="49" dy="0">Keep what a restart needs</tspan></text>
    <text x="50" y="926" font-size="22" fill="#16332f"><tspan x="50" dy="0">Keep the agreed scope and owner, exact</tspan><tspan x="50" dy="31">work version, unmet outcomes, pending</tspan><tspan x="50" dy="31">effects and real observations.</tspan></text>
    <path d="M29 1076 L529 1074 L531 1387 L27 1390 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="1084" width="486" height="116" rx="16" fill="#f8e8ec" stroke="none" stroke-width="0"/>
    <ellipse cx="76" cy="1108" rx="20" ry="21" fill="#f5d9ae" stroke="#885000" stroke-width="2"/>
    <ellipse cx="70" cy="1105" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="83" cy="1105" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M71 1116 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="112" y="1116" font-size="23" fill="#885000" font-weight="700"><tspan x="112" dy="0">State what really happens</tspan><tspan x="112" dy="32">next</tspan></text>
    <text x="50" y="1233" font-size="22" fill="#16332f"><tspan x="50" dy="0">An authored continuation or explicit</tspan><tspan x="50" dy="31">resume; a real blocker and</tspan><tspan x="50" dy="31">reconsideration route; an accepted</tspan><tspan x="50" dy="31">transfer; or an agreed ending. Otherwise</tspan><tspan x="50" dy="31">expose the continuation gap.</tspan></text>
    <path d="M260 1397 Q292 1401 280 1420" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M273 1413 L280 1422 L288 1413" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M29 1434 L529 1432 L531 1714 L27 1717 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="1442" width="486" height="116" rx="16" fill="#e5f4ed" stroke="none" stroke-width="0"/>
    <ellipse cx="486" cy="1466" rx="20" ry="21" fill="#b9dce5" stroke="#00665f" stroke-width="2"/>
    <ellipse cx="480" cy="1463" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="493" cy="1463" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M481 1474 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="49" y="1474" font-size="23" fill="#00665f" font-weight="700"><tspan x="49" dy="0">Resume through a fresh</tspan><tspan x="49" dy="32">decision</tspan></text>
    <text x="50" y="1591" font-size="22" fill="#16332f"><tspan x="50" dy="0">Use current scope, cancellation and actual</tspan><tspan x="50" dy="31">observations. Respect an authored Stop or</tspan><tspan x="50" dy="31">Pause. Do not replay suppressed actions.</tspan></text>
    <path d="M29 1739 L531 1737 L527 1879 L32 1877 Z" stroke="#885000" stroke-width="1.5" fill="#fff0cd" stroke-linecap="round" stroke-linejoin="round" />
    <text x="46" y="1767" font-size="20" fill="#16332f"><tspan x="46" dy="0">Persistently eligible accepted work receives</tspan><tspan x="46" dy="29">another opportunity under declared</tspan><tspan x="46" dy="29">scheduling assumptions. A durable queue</tspan><tspan x="46" dy="29">entry alone is not that opportunity.</tspan></text>
    <text x="30" y="1914" font-size="19" fill="#405d58"><tspan x="30" dy="0">Characters personify design choices; they do not</tspan><tspan x="30" dy="28">assert feelings or consciousness. Scenes are</tspan><tspan x="30" dy="28">hypothetical.</tspan></text>
  </g>
</svg>
