<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">From experience to lasting development</title><desc id="desc">An actual experience is interpreted by its persona. A durable development question may close with no change or await evidence. A numerical candidate is compared, adopted and followed into later work. Benefit or regression remains observable.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20334b}.title{font-size:46px;font-weight:700}.subtitle{font-size:25px;fill:#536477}.heading{font-size:28px;font-weight:700}.body{font-size:24px}.edge{font-size:21px;fill:#536477}.note{font-size:25px;font-weight:700}.small{font-size:21px;fill:#536477}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="#63758a"/></marker></defs><rect width="1600" height="1000" fill="#ffffff"/><rect x="64" y="48" width="72" height="7" rx="3" fill="#236e60"/>
<text x="64" y="113" class="title"><tspan x="64" dy="0">From experience to lasting development</tspan></text>
<text x="64" y="158" class="subtitle"><tspan x="64" dy="0">A revision is a hypothesis about better behavior—not proof that it works.</tspan></text>
<rect x="64" y="230" width="416" height="208" rx="18" fill="#e3f3ef" stroke="#236e60" stroke-width="2"/>
<circle cx="98" cy="266" r="19" fill="#236e60"/>
<text x="98" y="274" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">1</text>
<text x="130" y="275" class="heading"><tspan x="130" dy="0">Actual experience</tspan></text>
<text x="88" y="324" class="body"><tspan x="88" dy="0">A decision, social exchange,</tspan><tspan x="88" dy="32">correction or outcome with</tspan><tspan x="88" dy="32">sources.</tspan></text>
<rect x="592" y="230" width="416" height="208" rx="18" fill="#e3f3ef" stroke="#236e60" stroke-width="2"/>
<circle cx="626" cy="266" r="19" fill="#236e60"/>
<text x="626" y="274" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">2</text>
<text x="658" y="275" class="heading"><tspan x="658" dy="0">Behavioral question</tspan></text>
<text x="616" y="324" class="body"><tspan x="616" dy="0">Explain the suspected cause;</tspan><tspan x="616" dy="32">retain alternatives and</tspan><tspan x="616" dy="32">exceptions.</tspan></text>
<rect x="1120" y="230" width="416" height="208" rx="18" fill="#eee9ff" stroke="#6551a5" stroke-width="2"/>
<circle cx="1154" cy="266" r="19" fill="#6551a5"/>
<text x="1154" y="274" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">3</text>
<text x="1186" y="275" class="heading"><tspan x="1186" dy="0">Parameter candidate</tspan></text>
<text x="1144" y="324" class="body"><tspan x="1144" dy="0">Literal edits to this</tspan><tspan x="1144" dy="32">persona’s exact current</tspan><tspan x="1144" dy="32">numerical model.</tspan></text>
<rect x="1120" y="560" width="416" height="208" rx="18" fill="#fff2d8" stroke="#8b6018" stroke-width="2"/>
<circle cx="1154" cy="596" r="19" fill="#8b6018"/>
<text x="1154" y="604" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">4</text>
<text x="1186" y="605" class="heading"><tspan x="1186" dy="0">Matched comparison</tspan></text>
<text x="1144" y="654" class="body"><tspan x="1144" dy="0">Inspect the target situation,</tspan><tspan x="1144" dy="32">counterexamples and retained</tspan><tspan x="1144" dy="32">strengths.</tspan></text>
<rect x="592" y="560" width="416" height="208" rx="18" fill="#eee9ff" stroke="#6551a5" stroke-width="2"/>
<circle cx="626" cy="596" r="19" fill="#6551a5"/>
<text x="626" y="604" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">5</text>
<text x="658" y="605" class="heading"><tspan x="658" dy="0">Reasoned adoption</tspan></text>
<text x="616" y="654" class="body"><tspan x="616" dy="0">The persona chooses. The</tspan><tspan x="616" dy="32">runtime changes one current</tspan><tspan x="616" dy="32">binding.</tspan></text>
<rect x="64" y="560" width="416" height="208" rx="18" fill="#e8f0ff" stroke="#315d94" stroke-width="2"/>
<circle cx="98" cy="596" r="19" fill="#315d94"/>
<text x="98" y="604" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">6</text>
<text x="130" y="605" class="heading"><tspan x="130" dy="0">Later consequences</tspan></text>
<text x="88" y="654" class="body"><tspan x="88" dy="0">Look for useful change, no</tspan><tspan x="88" dy="32">effect, regression and</tspan><tspan x="88" dy="32">transfer.</tspan></text>
<path d="M480 334 H592" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="480" y="284" width="49" height="30" rx="4" fill="white"/>
<text x="488" y="307" class="edge"><tspan x="488" dy="0">ask</tspan></text>
<path d="M1008 334 H1120" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1008" y="284" width="60" height="30" rx="4" fill="white"/>
<text x="1016" y="307" class="edge"><tspan x="1016" dy="0">edit</tspan></text>
<path d="M1328 438 V560" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1346" y="483" width="93" height="30" rx="4" fill="white"/>
<text x="1354" y="506" class="edge"><tspan x="1354" dy="0">compare</tspan></text>
<path d="M1120 664 H1008" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1008" y="615" width="71" height="30" rx="4" fill="white"/>
<text x="1016" y="638" class="edge"><tspan x="1016" dy="0">judge</tspan></text>
<path d="M592 664 H480" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="480" y="615" width="49" height="30" rx="4" fill="white"/>
<text x="488" y="638" class="edge"><tspan x="488" dy="0">use</tspan></text>
<path d="M64 664 H32 V334 H64" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="56" y="477" width="225" height="30" rx="4" fill="white"/>
<text x="64" y="500" class="edge"><tspan x="64" dy="0">refine or roll back</tspan></text>
<path d="M800 438 V474" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="405" y="476" width="790" height="58" rx="14" fill="#f2f5f8" stroke="#63758a" stroke-width="1.5"/>
<text x="430" y="513" class="body"><tspan x="430" dy="0">Or: no change · gather evidence · choose a later revisit</tspan></text>
<rect x="64" y="844" width="1472" height="79" rx="16" fill="#f2f5f8"/>
<text x="90" y="877" class="note"><tspan x="90" dy="0">No-change, deferral and rejection remain real choices. Adoption begins observation.</tspan></text>
<text x="64" y="962" class="small"><tspan x="64" dy="0">Conceptual design • Arrows show possible transitions, not demonstrated improvement.</tspan></text>
</svg>
