<svg xmlns="http://www.w3.org/2000/svg" width="560" height="2074" viewBox="0 0 560 2074" role="img" aria-labelledby="title description">
  <title id="title">Recover without inventing success</title>
  <desc id="description">An uncertain external effect remains unresolved through restart. Actual attempts, usage and responsibility persist; missing acknowledgement is not definite failure or permission to replay the effect. Expressive cartoon characters and concrete artifacts illustrate the mechanism; this is a hypothetical teaching scene.</desc>
  <rect width="560" height="2074" fill="#fffaf0"/>
  <g font-family="Liberation Sans, Arial, sans-serif">
    <text x="28" y="55" font-size="27" fill="#16332f" font-weight="700"><tspan x="28" dy="0">Recover without inventing</tspan><tspan x="28" dy="36">success</tspan></text>
    <text x="28" y="129" font-size="17" fill="#00665f" font-weight="700"><tspan x="28" dy="0">AN ILLUSTRATED DESIGN STORY</tspan></text>
    <rect x="20" y="153" width="520" height="330" rx="20" fill="#e8effb" stroke="#d0d5cb" stroke-width="1"/>
    <rect x="34" y="168" width="490" height="56" rx="20" fill="#ffffff" stroke="#885000" stroke-width="3"/>
    <path d="M59 222 L62 244 L84 222" stroke="#885000" stroke-width="3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <text x="49" y="200" font-size="22" fill="#885000" font-weight="700"><tspan x="49" dy="0">No reply yet. Did the action happen?</tspan></text>
    <g transform="translate(105 378) scale(1)">
      <ellipse cx="0" cy="74" rx="47" ry="7" fill="#d8dfd5" stroke="none" stroke-width="3"/>
      <path d="M-30 63 Q-31 15 0 13 Q31 15 30 63 Z" stroke="#16332f" stroke-width="3" fill="#00665f" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-13 61 L-16 76 M13 61 L18 76" stroke="#16332f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-24 30 Q-45 41 -54 24 M24 30 Q44 25 50 9" stroke="#16332f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <ellipse cx="0" cy="-10" rx="32" ry="35" fill="#f5d9ae" stroke="#16332f" stroke-width="3"/>
      <path d="M-30 -20 L-22 -43 L0 -38 L23 -44 L31 -17" stroke="#16332f" stroke-width="3" fill="#00665f" stroke-linecap="round" stroke-linejoin="round" />
      <ellipse cx="-10" cy="-12" rx="3" ry="4" fill="#16332f" stroke="none" stroke-width="3"/>
      <ellipse cx="11" cy="-12" rx="3" ry="4" fill="#16332f" stroke="none" stroke-width="3"/>
      <path d="M-17 -23 L-7 -26 M6 -25 L17 -20" stroke="#16332f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M-7 8 Q1 2 9 8" stroke="#16332f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <rect x="230" y="322" width="115" height="77" rx="5" fill="#ffffff" stroke="#245599" stroke-width="3"/>
    <path d="M232 325 L287.5 365 L343 325" stroke="#245599" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="226" y="428" font-size="20" fill="#245599" font-weight="700"><tspan x="226" dy="0">Sent</tspan><tspan x="226" dy="29">request</tspan></text>
    <text x="430" y="388" font-size="65" fill="#885000" font-weight="700"><tspan x="430" dy="0">?</tspan></text>
    <text x="370" y="435" font-size="20" fill="#885000" font-weight="700"><tspan x="370" dy="0">Unresolved</tspan></text>
    <path d="M28 505 L529 503 L525 589 L32 587 Z" stroke="#00665f" stroke-width="2" fill="#00665f" stroke-linecap="round" stroke-linejoin="round" />
    <text x="47" y="535" font-size="22" fill="#ffffff" font-weight="700"><tspan x="47" dy="0">An attempted action can have an</tspan><tspan x="47" dy="31">unknown effect</tspan></text>
    <path d="M29 613 L529 611 L531 831 L27 834 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="621" width="486" height="116" rx="16" fill="#e8effb" stroke="none" stroke-width="0"/>
    <ellipse cx="76" cy="645" rx="20" ry="21" fill="#f5d9ae" stroke="#885000" stroke-width="2"/>
    <ellipse cx="70" cy="642" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="83" cy="642" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M71 653 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="112" y="653" font-size="23" fill="#885000" font-weight="700"><tspan x="112" dy="0">Example: a request was sent,</tspan><tspan x="112" dy="32">but no reply arrived</tspan></text>
    <text x="50" y="770" font-size="22" fill="#16332f"><tspan x="50" dy="0">The absence of a receipt does not prove</tspan><tspan x="50" dy="31">that the outside operation failed.</tspan></text>
    <path d="M260 841 Q292 845 280 864" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M273 857 L280 866 L288 857" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M29 878 L529 876 L531 1158 L27 1161 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="886" width="486" height="116" rx="16" fill="#fff0cd" stroke="none" stroke-width="0"/>
    <ellipse cx="486" cy="910" rx="20" ry="21" fill="#b9dce5" stroke="#00665f" stroke-width="2"/>
    <ellipse cx="480" cy="907" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="493" cy="907" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M481 918 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="49" y="918" font-size="23" fill="#00665f" font-weight="700"><tspan x="49" dy="0">Keep the unresolved effect</tspan><tspan x="49" dy="32">and account</tspan></text>
    <text x="50" y="1035" font-size="22" fill="#16332f"><tspan x="50" dy="0">Record the actual attempt and</tspan><tspan x="50" dy="31">uncertainty. Restart and repeated</tspan><tspan x="50" dy="31">messages do not erase earlier use or</tspan><tspan x="50" dy="31">responsibility.</tspan></text>
    <path d="M260 1168 Q292 1172 280 1191" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M273 1184 L280 1193 L288 1184" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M29 1205 L529 1203 L531 1485 L27 1488 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="1213" width="486" height="116" rx="16" fill="#f8e8ec" stroke="none" stroke-width="0"/>
    <ellipse cx="76" cy="1237" rx="20" ry="21" fill="#f5d9ae" stroke="#00665f" stroke-width="2"/>
    <ellipse cx="70" cy="1234" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="83" cy="1234" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M71 1245 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="112" y="1245" font-size="23" fill="#00665f" font-weight="700"><tspan x="112" dy="0">Reconcile using actual</tspan><tspan x="112" dy="32">evidence</tspan></text>
    <text x="50" y="1362" font-size="22" fill="#16332f"><tspan x="50" dy="0">Use the actual interface and</tspan><tspan x="50" dy="31">observations to establish what</tspan><tspan x="50" dy="31">happened. Do not repeat an action</tspan><tspan x="50" dy="31">blindly when duplication matters.</tspan></text>
    <path d="M260 1495 Q292 1499 280 1518" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M273 1511 L280 1520 L288 1511" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M29 1532 L529 1530 L531 1812 L27 1815 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="1540" width="486" height="116" rx="16" fill="#e5f4ed" stroke="none" stroke-width="0"/>
    <ellipse cx="486" cy="1564" rx="20" ry="21" fill="#b9dce5" stroke="#00665f" stroke-width="2"/>
    <ellipse cx="480" cy="1561" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="493" cy="1561" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M481 1572 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="49" y="1572" font-size="23" fill="#00665f" font-weight="700"><tspan x="49" dy="0">Then choose the justified next</tspan><tspan x="49" dy="32">step</tspan></text>
    <text x="50" y="1689" font-size="22" fill="#16332f"><tspan x="50" dy="0">Choose useful work, recovery,</tspan><tspan x="50" dy="31">qualified delivery or a wait.</tspan><tspan x="50" dy="31">Distinguish unknown usage from</tspan><tspan x="50" dy="31">unresolved execution.</tspan></text>
    <path d="M29 1837 L531 1835 L527 1948 L32 1946 Z" stroke="#885000" stroke-width="1.5" fill="#fff0cd" stroke-linecap="round" stroke-linejoin="round" />
    <text x="46" y="1865" font-size="20" fill="#16332f"><tspan x="46" dy="0">A request, dispatch, outside effect, received</tspan><tspan x="46" dy="29">receipt and interpreted success are different</tspan><tspan x="46" dy="29">events.</tspan></text>
    <text x="30" y="1983" font-size="19" fill="#405d58"><tspan x="30" dy="0">Characters personify design choices; they do not</tspan><tspan x="30" dy="28">assert feelings or consciousness. Scenes are</tspan><tspan x="30" dy="28">hypothetical.</tspan></text>
  </g>
</svg>
