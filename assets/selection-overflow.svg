<svg xmlns="http://www.w3.org/2000/svg" width="560" height="2056" viewBox="0 0 560 2056" role="img" aria-labelledby="title description">
  <title id="title">When selected context is too large</title>
  <desc id="description">An oversized ordinary request triggers a limited repair path only if its mandatory core and authority fit. Repair cannot perform task work, and any resumed task needs fresh ordinary admission. Expressive cartoon characters and concrete artifacts illustrate the mechanism; this is a hypothetical teaching scene.</desc>
  <rect width="560" height="2056" fill="#fffaf0"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="28" y="55" font-size="27" fill="#16332f" font-weight="700"><tspan x="28" dy="0">When selected context is too</tspan><tspan x="28" dy="36">large</tspan></text>
    <text x="28" y="129" font-size="17" fill="#00665f" font-weight="700"><tspan x="28" dy="0">AN ILLUSTRATED DESIGN STORY</tspan></text>
    <rect x="20" y="153" width="520" height="330" rx="20" fill="#f8e8ec" stroke="#d0d5cb" stroke-width="1"/>
    <rect x="34" y="168" width="490" height="87" rx="20" fill="#ffffff" stroke="#885000" stroke-width="3"/>
    <path d="M59 253 L62 275 L84 253" stroke="#885000" stroke-width="3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <text x="49" y="200" font-size="22" fill="#885000" font-weight="700"><tspan x="49" dy="0">Too much context? Repair the</tspan><tspan x="49" dy="31">choice.</tspan></text>
