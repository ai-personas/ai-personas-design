    <ellipse cx="76" cy="537" rx="20" ry="21" fill="#f5d9ae" stroke="#885000" stroke-width="2"/>
    <ellipse cx="70" cy="534" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="83" cy="534" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M71 545 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="112" y="545" font-size="23" fill="#885000" font-weight="700"><tspan x="112" dy="0">The complete ordinary</tspan><tspan x="112" dy="32">request will not fit</tspan></text>
    <text x="50" y="662" font-size="22" fill="#16332f"><tspan x="50" dy="0">Do not silently shorten valid selected</tspan><tspan x="50" dy="31">text or drop required qualifications.</tspan></text>
    <path d="M260 733 Q292 737 280 756" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M273 749 L280 758 L288 749" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M29 770 L529 768 L531 1081 L27 1084 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="778" width="486" height="116" rx="16" fill="#e5f4ed" stroke="none" stroke-width="0"/>
    <ellipse cx="486" cy="802" rx="20" ry="21" fill="#b9dce5" stroke="#00665f" stroke-width="2"/>
    <ellipse cx="480" cy="799" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="493" cy="799" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M481 810 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="49" y="810" font-size="23" fill="#00665f" font-weight="700"><tspan x="49" dy="0">Can the mandatory repair</tspan><tspan x="49" dy="32">core fit?</tspan></text>
    <text x="50" y="927" font-size="22" fill="#16332f"><tspan x="50" dy="0">If no, block. If yes, authorized repair may</tspan><tspan x="50" dy="31">receive a bounded inventory of exact</tspan><tspan x="50" dy="31">selected references and mechanical fit</tspan><tspan x="50" dy="31">diagnostics. Optional bodies remain</tspan><tspan x="50" dy="31">withheld.</tspan></text>
    <path d="M260 1091 Q292 1095 280 1114" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M273 1107 L280 1116 L288 1107" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M29 1128 L529 1126 L531 1470 L27 1473 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="1136" width="486" height="116" rx="16" fill="#e8effb" stroke="none" stroke-width="0"/>
    <ellipse cx="76" cy="1160" rx="20" ry="21" fill="#f5d9ae" stroke="#00665f" stroke-width="2"/>
    <ellipse cx="70" cy="1157" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="83" cy="1157" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M71 1168 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="112" y="1168" font-size="23" fill="#00665f" font-weight="700"><tspan x="112" dy="0">Restricted repair: narrow,</tspan><tspan x="112" dy="32">clear or stop</tspan></text>
    <text x="50" y="1285" font-size="22" fill="#16332f"><tspan x="50" dy="0">Further inspection needs a permitted</tspan><tspan x="50" dy="31">exact repair read with complete</tspan><tspan x="50" dy="31">qualifications and a fresh observation.</tspan><tspan x="50" dy="31">Only allowed optional-selection changes</tspan><tspan x="50" dy="31">are available. No task action, semantic</tspan><tspan x="50" dy="31">rewrite or change of model.</tspan></text>
    <path d="M260 1480 Q292 1484 280 1503" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M273 1496 L280 1505 L288 1496" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M29 1517 L529 1515 L531 1765 L27 1768 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="1525" width="486" height="84" rx="16" fill="#fff0cd" stroke="none" stroke-width="0"/>
    <ellipse cx="486" cy="1549" rx="20" ry="21" fill="#b9dce5" stroke="#00665f" stroke-width="2"/>
    <ellipse cx="480" cy="1546" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="493" cy="1546" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M481 1557 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="49" y="1557" font-size="23" fill="#00665f" font-weight="700"><tspan x="49" dy="0">Check a new ordinary request</tspan></text>
    <text x="50" y="1642" font-size="22" fill="#16332f"><tspan x="50" dy="0">Recheck current character, authority,</tspan><tspan x="50" dy="31">versions, required conditions and</tspan><tspan x="50" dy="31">capacity. Supply the remaining exact</tspan><tspan x="50" dy="31">selected text before resumed work.</tspan></text>
    <path d="M29 1790 L531 1788 L527 1930 L32 1928 Z" stroke="#885000" stroke-width="1.5" fill="#fff0cd" stroke-linecap="round" stroke-linejoin="round" />
    <text x="46" y="1818" font-size="20" fill="#16332f"><tspan x="46" dy="0">Repair retains its charges and may fail. A stale</tspan><tspan x="46" dy="29">or inaccessible optional bundle has its own</tspan><tspan x="46" dy="29">withholding disposition; it is not an excuse to</tspan><tspan x="46" dy="29">truncate valid text.</tspan></text>
    <text x="30" y="1965" font-size="19" fill="#405d58"><tspan x="30" dy="0">Characters personify design choices; they do not</tspan><tspan x="30" dy="28">assert feelings or consciousness. Scenes are</tspan><tspan x="30" dy="28">hypothetical.</tspan></text>
  </g>
</svg>
