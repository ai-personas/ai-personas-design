    <rect x="367" y="302" width="105" height="145" rx="5" fill="#ffffff" stroke="#245599" stroke-width="3"/>
    <path d="M390 324 V426 H455" stroke="#245599" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="334" y="466" font-size="20" fill="#245599" font-weight="700"><tspan x="334" dy="0">No squeeze</tspan></text>
    <path d="M305 329 L334 370 M334 329 L305 370" stroke="#aa3d55" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
