<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1952" viewBox="0 0 560 1952" role="img" aria-labelledby="title description">
  <title id="title">From an origin to a continuing persona</title>
  <desc id="description">Generated and supplied origins keep their distinct attribution. Candidate fragments require coherent acceptance before later work uses that character. Later changes retain their actual authorship and adoption order. Expressive cartoon characters and concrete artifacts illustrate the mechanism; this is a hypothetical teaching scene.</desc>
  <rect width="560" height="1952" fill="#fffaf0"/>
  <g font-family="Liberation Sans, Arial, sans-serif">
    <text x="28" y="55" font-size="27" fill="#16332f" font-weight="700"><tspan x="28" dy="0">From an origin to a continuing</tspan><tspan x="28" dy="36">persona</tspan></text>
    <text x="28" y="129" font-size="17" fill="#00665f" font-weight="700"><tspan x="28" dy="0">AN ILLUSTRATED DESIGN STORY</tspan></text>
    <rect x="20" y="153" width="520" height="330" rx="20" fill="#f8e8ec" stroke="#d0d5cb" stroke-width="1"/>
    <rect x="34" y="168" width="490" height="87" rx="20" fill="#ffffff" stroke="#00665f" stroke-width="3"/>
    <path d="M59 253 L62 275 L84 253" stroke="#00665f" stroke-width="3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <text x="49" y="200" font-size="22" fill="#00665f" font-weight="700"><tspan x="49" dy="0">A truthful origin, then an accepted</tspan><tspan x="49" dy="31">beginning.</tspan></text>
