    <path d="M400 549 q10 8 20 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="306" y="602" font-size="22" fill="#245599" font-weight="700"><tspan x="306" dy="0">Supplied</tspan><tspan x="306" dy="31">beginning</tspan></text>
    <text x="306" y="676" font-size="21" fill="#16332f"><tspan x="306" dy="0">Imported or</tspan><tspan x="306" dy="30">supplied text keeps</tspan><tspan x="306" dy="30">its real origin and</tspan><tspan x="306" dy="30">authorship.</tspan></text>
