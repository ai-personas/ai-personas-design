    <ellipse cx="70" cy="881" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="83" cy="881" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M71 892 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="112" y="892" font-size="23" fill="#00665f" font-weight="700"><tspan x="112" dy="0">Candidate starting fragments</tspan></text>
    <text x="50" y="977" font-size="22" fill="#16332f"><tspan x="50" dy="0">Generated own-voice detail is a</tspan><tspan x="50" dy="31">proposal. It is not a newly asserted user</tspan><tspan x="50" dy="31">preference or lived experience.</tspan></text>
    <path d="M260 1079 Q292 1083 280 1102" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M273 1095 L280 1104 L288 1095" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M29 1116 L529 1114 L531 1364 L27 1367 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="1124" width="486" height="84" rx="16" fill="#e5f4ed" stroke="none" stroke-width="0"/>
    <ellipse cx="486" cy="1148" rx="20" ry="21" fill="#b9dce5" stroke="#00665f" stroke-width="2"/>
    <ellipse cx="480" cy="1145" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="493" cy="1145" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M481 1156 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="49" y="1156" font-size="23" fill="#00665f" font-weight="700"><tspan x="49" dy="0">Coherent acceptance</tspan></text>
    <text x="50" y="1241" font-size="22" fill="#16332f"><tspan x="50" dy="0">Accept the starting account and</tspan><tspan x="50" dy="31">fragments together. Preserve actual</tspan><tspan x="50" dy="31">authorship and unresolved</tspan><tspan x="50" dy="31">contradictions.</tspan></text>
    <path d="M260 1374 Q292 1378 280 1397" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M273 1390 L280 1399 L288 1390" stroke="#405d58" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M29 1411 L529 1409 L531 1690 L27 1693 Z" stroke="#16332f" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="37" y="1419" width="486" height="84" rx="16" fill="#e8effb" stroke="none" stroke-width="0"/>
    <ellipse cx="76" cy="1443" rx="20" ry="21" fill="#f5d9ae" stroke="#00665f" stroke-width="2"/>
    <ellipse cx="70" cy="1440" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <ellipse cx="83" cy="1440" rx="2" ry="3" fill="#16332f" stroke="none" stroke-width="3"/>
    <path d="M71 1451 q7 5 13 -2" stroke="#16332f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <text x="112" y="1451" font-size="23" fill="#00665f" font-weight="700"><tspan x="112" dy="0">Ordinary continuing persona</tspan></text>
    <text x="50" y="1536" font-size="22" fill="#16332f"><tspan x="50" dy="0">The primary LLM works, chooses context</tspan><tspan x="50" dy="31">and authors useful revisions. Useful</tspan><tspan x="50" dy="31">tension can remain; harmonization is not</tspan><tspan x="50" dy="31">automatic uniformity.</tspan></text>
    <path d="M29 1715 L531 1713 L527 1826 L32 1824 Z" stroke="#885000" stroke-width="1.5" fill="#fff0cd" stroke-linecap="round" stroke-linejoin="round" />
    <text x="46" y="1743" font-size="20" fill="#16332f"><tspan x="46" dy="0">An effective-character adoption needs a fresh</tspan><tspan x="46" dy="29">decision before further operations.</tspan></text>
    <text x="30" y="1861" font-size="19" fill="#405d58"><tspan x="30" dy="0">Characters personify design choices; they do not</tspan><tspan x="30" dy="28">assert feelings or consciousness. Scenes are</tspan><tspan x="30" dy="28">hypothetical.</tspan></text>
  </g>
</svg>
