    <text x="43" y="676" font-size="21" fill="#16332f"><tspan x="43" dy="0">An attributed trait</tspan><tspan x="43" dy="30">seed guides the</tspan><tspan x="43" dy="30">initial LLM call.</tspan></text>
    <path d="M291 503 l239 2 l1 302 l-241 1 Z" stroke="#245599" stroke-width="2.3" fill="#ffffff" stroke-linecap="round" stroke-linejoin="round" />
