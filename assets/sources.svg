<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Keep requirements, design and evidence distinct</title><desc id="desc">Human requirements state intent, design documents propose the mechanism, source code shows available paths, runtime reports describe bounded observations, research supplies limited motivation, and later evidence is needed for useful maturation.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20334b}.title{font-size:46px;font-weight:700}.subtitle{font-size:25px;fill:#536477}.heading{font-size:28px;font-weight:700}.body{font-size:24px}.edge{font-size:21px;fill:#536477}.note{font-size:25px;font-weight:700}.small{font-size:21px;fill:#536477}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="#63758a"/></marker></defs><rect width="1600" height="1000" fill="#ffffff"/><rect x="64" y="48" width="72" height="7" rx="3" fill="#236e60"/>
<text x="64" y="113" class="title"><tspan x="64" dy="0">Keep requirements, design and evidence distinct</tspan></text>
<text x="64" y="158" class="subtitle"><tspan x="64" dy="0">Different sources answer different questions. None grants an automatic pass.</tspan></text>
<rect x="64" y="220" width="1472" height="78" rx="13" fill="#edf1f5" stroke="#536477" stroke-width="1.5"/>
<text x="90" y="269" class="heading"><tspan x="90" dy="0">Human requirements</tspan></text>
<text x="670" y="269" class="body"><tspan x="670" dy="0">What must the product accomplish?</tspan></text>
<rect x="64" y="315" width="1472" height="78" rx="13" fill="#eee9ff" stroke="#6551a5" stroke-width="1.5"/>
<text x="90" y="364" class="heading"><tspan x="90" dy="0">Design documents</tspan></text>
<text x="670" y="364" class="body"><tspan x="670" dy="0">How should the pieces work together?</tspan></text>
<rect x="64" y="410" width="1472" height="78" rx="13" fill="#e8f0ff" stroke="#315d94" stroke-width="1.5"/>
<text x="90" y="459" class="heading"><tspan x="90" dy="0">Inspected source code</tspan></text>
<text x="670" y="459" class="body"><tspan x="670" dy="0">Which mechanisms exist at an exact revision?</tspan></text>
<rect x="64" y="505" width="1472" height="78" rx="13" fill="#e3f3ef" stroke="#236e60" stroke-width="1.5"/>
<text x="90" y="554" class="heading"><tspan x="90" dy="0">Reported runtime observations</tspan></text>
<text x="670" y="554" class="body"><tspan x="670" dy="0">What happened in the reported configuration?</tspan></text>
<rect x="64" y="600" width="1472" height="78" rx="13" fill="#fff2d8" stroke="#8b6018" stroke-width="1.5"/>
<text x="90" y="649" class="heading"><tspan x="90" dy="0">Published component research</tspan></text>
<text x="670" y="649" class="body"><tspan x="670" dy="0">Which bounded ideas motivate a comparison?</tspan></text>
<rect x="64" y="695" width="1472" height="78" rx="13" fill="#fff2d8" stroke="#8b6018" stroke-width="1.5"/>
<text x="90" y="744" class="heading"><tspan x="90" dy="0">Evidence of useful maturation</tspan></text>
<text x="670" y="744" class="body"><tspan x="670" dy="0">Did changed parameters help later real behavior?</tspan></text>
<rect x="64" y="844" width="1472" height="79" rx="16" fill="#f2f5f8"/>
<text x="90" y="877" class="note"><tspan x="90" dy="0">This publication updates a design. It does not execute the runtime or demonstrate new learning.</tspan></text>
<text x="64" y="962" class="small"><tspan x="64" dy="0">Conceptual design • Arrows show possible transitions, not demonstrated improvement.</tspan></text>
</svg>
