<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Read the design at the depth you need</title><desc id="desc">The reading map leads from the plain-language introduction to user requirements, then the focused persona, development, context, collaboration and work chapters. System contracts specify observable handoffs; evaluation explains what evidence would establish claims.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20334b}.title{font-size:46px;font-weight:700}.subtitle{font-size:25px;fill:#536477}.heading{font-size:28px;font-weight:700}.body{font-size:24px}.edge{font-size:21px;fill:#536477}.note{font-size:25px;font-weight:700}.small{font-size:21px;fill:#536477}</style><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10" fill="#63758a"/></marker></defs><rect width="1600" height="1000" fill="#ffffff"/><rect x="64" y="48" width="72" height="7" rx="3" fill="#236e60"/>
<text x="64" y="113" class="title"><tspan x="64" dy="0">Read the design at the depth you need</tspan></text>
<text x="64" y="158" class="subtitle"><tspan x="64" dy="0">Start with the idea; follow one topic to its precise rules and evidence.</tspan></text>
<rect x="64" y="230" width="448" height="210" rx="18" fill="#e8f0ff" stroke="#315d94" stroke-width="2"/>
<circle cx="98" cy="266" r="19" fill="#315d94"/>
<text x="98" y="274" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">1</text>
<text x="130" y="275" class="heading"><tspan x="130" dy="0">Start here</tspan></text>
<text x="88" y="324" class="body"><tspan x="88" dy="0">The central idea and one</tspan><tspan x="88" dy="32">ordinary example.</tspan></text>
<rect x="576" y="230" width="448" height="210" rx="18" fill="#edf1f5" stroke="#536477" stroke-width="2"/>
<circle cx="610" cy="266" r="19" fill="#536477"/>
<text x="610" y="274" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">2</text>
<text x="642" y="275" class="heading"><tspan x="642" dy="0">User requirements</tspan></text>
<text x="600" y="324" class="body"><tspan x="600" dy="0">What the human asked for; later</tspan><tspan x="600" dy="32">clarifications govern.</tspan></text>
<rect x="1088" y="230" width="448" height="210" rx="18" fill="#eee9ff" stroke="#6551a5" stroke-width="2"/>
<circle cx="1122" cy="266" r="19" fill="#6551a5"/>
<text x="1122" y="274" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">3</text>
<text x="1154" y="275" class="heading"><tspan x="1154" dy="0">Focused design</tspan></text>
<text x="1112" y="324" class="body"><tspan x="1112" dy="0">Identity, development, context,</tspan><tspan x="1112" dy="32">collaboration and work.</tspan></text>
<rect x="1088" y="560" width="448" height="210" rx="18" fill="#fff2d8" stroke="#8b6018" stroke-width="2"/>
<circle cx="1122" cy="596" r="19" fill="#8b6018"/>
<text x="1122" y="604" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">4</text>
<text x="1154" y="605" class="heading"><tspan x="1154" dy="0">System contracts</tspan></text>
<text x="1112" y="654" class="body"><tspan x="1112" dy="0">Exact meanings of handoffs,</tspan><tspan x="1112" dy="32">model changes and recovery.</tspan></text>
<rect x="576" y="560" width="448" height="210" rx="18" fill="#e3f3ef" stroke="#236e60" stroke-width="2"/>
<circle cx="610" cy="596" r="19" fill="#236e60"/>
<text x="610" y="604" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">5</text>
<text x="642" y="605" class="heading"><tspan x="642" dy="0">Examples</tspan></text>
<text x="600" y="654" class="body"><tspan x="600" dy="0">Follow hypothetical work and</tspan><tspan x="600" dy="32">social development over time.</tspan></text>
<rect x="64" y="560" width="448" height="210" rx="18" fill="#fff2d8" stroke="#8b6018" stroke-width="2"/>
<circle cx="98" cy="596" r="19" fill="#8b6018"/>
<text x="98" y="604" text-anchor="middle" style="font-size:23px;font-weight:700;fill:white">6</text>
<text x="130" y="605" class="heading"><tspan x="130" dy="0">Evidence and status</tspan></text>
<text x="88" y="654" class="body"><tspan x="88" dy="0">Distinguish intended design,</tspan><tspan x="88" dy="32">observed mechanics and benefit.</tspan></text>
<path d="M512 335 H576" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1024 335 H1088" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1312 440 V560" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1088 665 H1024" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M576 665 H512" fill="none" stroke="#63758a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="64" y="844" width="1472" height="79" rx="16" fill="#f2f5f8"/>
<text x="90" y="877" class="note"><tspan x="90" dy="0">Diagrams explain the prose. Examples, research and old results cannot override user requirements.</tspan></text>
<text x="64" y="962" class="small"><tspan x="64" dy="0">Conceptual design • Arrows show possible transitions, not demonstrated improvement.</tspan></text>
</svg>
