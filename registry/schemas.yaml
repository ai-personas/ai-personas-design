    emitters: ["src/personaos/federation/recruitment.py:FederatedRecruitment._invitation_verification"]
    notes: >-
      Receipt-time independently verified author card and verification key,
      retained under local kernel-signed lineage beside the unchanged invitation
      package. Replay rechecks the exact source package against this authority;
      an absent discovery cache does not become a new source of trust.

  - id: personaos-federated-persona-invitation-delivery-state/1
    class: exact
    class_decided_by: "09_PROTOCOLS.md §4"
    status: current
    tiers: [lineage]
