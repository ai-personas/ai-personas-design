  - id: personaos-workspace-publication-sync/1
    class: open
    class_decided_by: "05_ENVIRONMENT.md §4"
    status: current
    tiers: [lineage]
    owner: "05_ENVIRONMENT.md §4"
    members:
      required: [environment_id, task_id, persona_id, publisher_persona_id,
        publication_event_id, publication_event_hash, workspace_state_signature,
        synced_at, grants_wake, semantic_interpretation_performed]
      optional: [synced_commit_id, retroactive_backfill]
    emitters: ["src/personaos/runtime.py:_record_publication_workspace_sync_facts"]
    notes: >-
      Kernel-signed lineage observation associating one admitted publication
      with a synchronized peer. The current producer always emits a nonempty
      synced_commit_id: the peer's full immutable commit id captured under the
      environment lock. Each candidate publication independently requires its
      own verified, nonempty delivered path/size/SHA-256 set to match regular
      files in that commit, using exact reads that ignore Git replacement
      references. Extra unrelated files are allowed. Current and older admitted
      candidates retain their own event/hash/publisher/workspace bindings;
      retroactive_backfill is true only for an older candidate. grants_wake and
      semantic_interpretation_performed are false. synced_commit_id is optional
      in this same-version row because historical signed facts may omit it;
      their existing acceptance interpretation is unchanged. The new check
      governs future fact emission and does not retroactively establish byte
      evidence for older facts or assert a later worktree's contents.

