# registry/schemas.yaml — the registry of record for schema ids
# (14_DECISIONS.md ADR-0114 dec 1). One row per id; 09_PROTOCOLS.md §13.5
# (from S2) renders from this file, and the code repository vendors the
# generated tables with this registry's hash.
#
# Row shape
#   id                the schema id, `<name>/<integer>`
#   class             exact | open | rendered — one reader policy each
#                     (ADR-0114 dec 2)
#   class_decided_by  `seed` until the adversarial review of the first stage
#                     that generates a reader from the row decides it; the
#                     seed count never grows after S2
#   tiers             the surfaces the record rides:
#                     public_anonymous | operator | prompt | lineage
#   owner             the 00–12 section that defines the record, an ADR
#                     decision until that section is written, or `registry`
#   members           name → {type, required, item | key/value | members,
#                     tiers?, empty_when?, is?}; types are rows of
#                     registry/types.yaml; `empty_when` names the one
#                     condition under which a required member is the empty
#                     string (`available`, `unrecorded`);
#                     `schema` (schema_id) is a member of every row and is
#                     not repeated
#   notes             what the row must say that its members do not
#
# S0 seeds exactly the five rows the first stage touches; S2 re-seeds the
# remaining ids around them.
registry: schemas
owner: registry
rows:
  - id: persona-learning-content/2
    class: open
    class_decided_by: "02 §2b; 09 §2"
    status: current
    tiers: [in_process, prompt]
    owner: "02 §2b; 09 §2"
    members:
      required: [json_pointer, selected_content_hash, selected_canonical_size, offset_bytes,
        next_offset_bytes, eof, content_complete, semantic_selection_performed]
      optional: [ok, source_value_hash, source_content_ref, source_canonical_size,
        expertise_awarded, content_value, content_text]
    emitters: ["src/personaos/protocols/mcp_lanes/learning.py:BridgeLearningMixin.inspect_persona_learning_history",
      "src/personaos/runtime.py:_persona_learning_content_facts"]
    notes: >-
      Authorized exact JSON-pointer selection with consecutive UTF-8 byte pages. Whole reads
      contain content_value; partial reads contain content_text and a next byte offset. No
      semantic ranking or silent truncation occurs.

  - id: personaos-artifact-manifest/1
    class: open
    class_decided_by: "03 §9; 09 §2.5"
    status: current
    tiers: [lineage, operator, in_process]
    owner: "03 §9; 09 §2.5"
    members:
      required: [files]
      optional: []
    emitters: []
    notes: >-
      An ordinary published artifact with a nonempty list of unique delivered file paths, byte
      lengths and SHA-256 hashes. It grants no requirement coverage or acceptance by itself.

  - id: personaos-artifact-review-execution/1
    class: open
