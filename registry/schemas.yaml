      optional: [check_source, check_source_hash, input_integrity_verified, output_hashes,
        output_change_census]
    emitters: ["src/personaos/artifact_snapshots.py:prepare_snapshot_review",
      "src/personaos/protocols/mcp_lanes/exec.py:BridgeExecMixin.command_exec"]
    notes: >-
      Execution binds the exact artifact snapshot and check sources. Inputs and checks are
      separate from writable scratch/output directories. The existing signed execution event
      remains the evidence authority.

  - id: personaos-artifact-snapshot/1
    class: exact
