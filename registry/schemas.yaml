      required: [signing_key_id, manifest, signed_by]
      optional: []
    emitters: ["src/personaos/environment/portability.py:export_environment_snapshot"]
    notes: >-
      Source-kernel-signed snapshot whose manifest binds source_kernel_id,
      source_environment_id, captured_at, exact environment/source_lineage/
      workspace/tools member descriptors and the complete blob_inventory.
      This is the declared environment-owned closure. source_lineage separately
      declares external private persona-context and foreign-lineage dependencies
      without fetching their bodies. prior_import retains a previous locally
      signed transaction and its recursively verified ancestor inventory.
      Capture is private until separately authorized disclosure. Retained source
      memberships, triggers, registries and recipes are historical evidence,
      never destination execution authority.

  - id: personaos-environment-import-transaction/1
    class: exact
    class_decided_by: "05_ENVIRONMENT.md §9"
    status: current
    tiers: [lineage, in_process]
