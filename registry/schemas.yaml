      optional: []
    emitters: ["src/personaos/persona_snapshot_sharing.py:owner_export_persona_snapshot"]
    notes: >-
      Compact route and exact publication descriptor with content_hash,
      content_ref and size_bytes. It grants no access or adoption authority.
      Import requires an independently supplied source kernel key and exact
      already registered local destination; it creates no persona identity.

  - id: personaos-persona-snapshot-availability/1
