    emitters: ["src/personaos/protocols/mcp_lanes/communication.py:529",
      "src/personaos/wake_carriers.py:531", "src/personaos/wake_carriers.py:540",
      "src/personaos/wake_carriers.py:583"]
    notes: >-
      The prompt lane of pending persona communication (the 09 §13 cutover
      list retired from the canon on 2026-09-05 names it
      `personaos-pending-persona-communication/1`). Cursor rule 2026-09-03
      (now the cursor contract of 09 §4.5, ADR-0115 dec 2): the prompt lane
      shows a member the messages it was never shown; the read action serves
      the complete set with whole bodies. Those are two sequences, so a cursor
      names which one it addresses in its namespace and is honoured only by
      that projection, and a cursor is bound to the message sequence (the
      ordered authority hashes) rather than to one rendering of it — a body
      stubbed in the prompt and served whole by the action is the same
      snapshot. Both paged lanes answer a cursor refusal the same way: the
      reason by name, the recovery (read again with no cursor) and `retryable:
      true`, because a stale cursor is recoverable and an unreadable lane is
      not.

