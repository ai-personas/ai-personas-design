          members:
            kind: {type: text, required: true}
            at: {type: iso_instant, required: true, empty_when: unrecorded}
            mode: {type: text, required: false}
            accepted: {type: bool, required: false}
            task_id: {type: bounded_id, required: false}
            mode_proficiency: {type: text, required: false}
            reason: {type: text, required: false}
      thinking_frame: {type: text, required: true, is: "the persona's current system frame; its bound is a registry/bounds.yaml row"}
      tier: {type: text, required: true, is: "`operator`"}
      recent_outputs:
        type: list
        required: true
        item:
          type: map
          members:
            kind: {type: text, required: true}
            at: {type: iso_instant, required: true, empty_when: unrecorded}
            text: {type: text, required: true}
      current_work_state: {type: map, required: true, is: "the persona's latest `personaos-persona-work-state-surface/5` record bound to the latest observation, else its newest; empty when none"}
      work_state_history: {type: list, item: map, required: true, is: "the persona's own `personaos-persona-work-state-surface/5` records, signature-verified; the count is a registry/bounds.yaml row"}
    notes: >-
      An operator interface of the 09_PROTOCOLS.md §12a family serving
      exact-access material under §12; never anonymous, never redacted. The
      owner paragraph is written into 09 §12a at S4 (ADR-0116 dec 2); until
      then the decision owns the row.

  - id: personaos-node-status-public/1
