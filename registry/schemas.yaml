      external_artifact_fulfillment: {type: map, required: true, is: "the `personaos-external-artifact-fulfillment-status/1` record (the row below)"}
      generated_at: {type: iso_instant, required: true}
      read_access: {type: text, required: true}
    notes: >-
      Counts, presence and availability facts about the node; never a
      locator, a path or a key. Fallback form the live node still answers
      with before its public status is built: `schema` and `node_id` alone —
      a document that renders as a status while stating nothing, retired at
      S0's kernel commit (13 §20, ADR-0116).

  - id: personaos-external-artifact-fulfillment-status/1
    class: rendered
    class_decided_by: seed
    tiers: [public_anonymous, operator]
    owner: "09_PROTOCOLS.md §6"
    members:
      event_driven: {type: bool, required: true}
      startup_replay: {type: bool, required: true}
      parallel_worker_limit: {type: integer, required: true, is: "an operator-declared ceiling"}
      running_count: {type: integer, required: true}
      scheduled_count: {type: integer, required: true}
      state_counts: {type: map, key: text, value: integer, required: true}
      providers:
        type: list
        required: true
        tiers: [public_anonymous, operator, prompt]
        item:
          type: map
          members:
            provider_id: {type: bounded_id, required: true}
            available: {type: bool, required: true}
            reason_code: {type: reason_code, required: true, empty_when: available, is: "why `available` is false"}
            checked_at: {type: iso_instant, required: true}
      provider_selection: {type: text, required: true}
      persona_authors_prompt_and_constraints: {type: bool, required: true}
      persona_authors_provider_and_model_choice: {type: bool, required: true}
      provider_or_model_ranked_by_substrate: {type: bool, required: true}
      auto_admission: {type: bool, required: true}
      requests: {type: list, item: map, required: false, tiers: [operator]}
      status_unavailable: {type: bool, required: false, is: "present and true only in the fallback form, when the status could not be built"}
      detail: {type: text, required: false, tiers: [operator], is: "emitted only by the fallback form, for the operator"}
    notes: >-
      `providers` rows replace `provider_ids` (ADR-0116 dec 3): a provider is
      listed only with its availability and reason, and the same rows ride the
      member's inventory beside the external-artifact request action. The
      public form carries no path and no digest of a helper. Fallback form
      when the status cannot be built: `schema` and `status_unavailable`
      (plus `detail` for the operator) and no other member.

