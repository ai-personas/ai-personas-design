  # === rows below this line are the output of tools/registry.py seed (S2, ADR-0114 dec 1) ===
  # Regenerated from the code on every run, in id order: a row here is
  # defined by its one emitter and follows it. The rows above this line were
  # written by a person or a decision and the seed never touches them; a row
  # a review decides (a class, a typed member, an owner, a note) moves above
  # the line, and a version that leaves the code keeps its row above the line
  # with `status: retired` (09 §13.4). Seed conventions (the docstring of
  # tools/registry.py states the rules; every row here is
  # `class_decided_by: seed` and owner is the placeholder):
  #   status    current | frozen | retired; a row without one is current
  #   tiers     best effort from the emitting module and the name; in_process
  #             when the record crosses no surface the seed knows
  #   members   {required, optional} — the literal member names of the one
