  - id: personaos-federated-persona-invitation/2
    class: exact
    class_decided_by: "09_PROTOCOLS.md §4"
    status: current
    tiers: [lineage, in_process]
    owner: "09_PROTOCOLS.md §4"
    members:
      required: [authority, authority_hash, author_card_hash, target_card_hash,
        target_card_authority, author_card_authority, author_kernel_id,
        target_kernel_id, signing_key_id, signed_by, package_hash]
      optional: []
    emitters: ["src/personaos/federation/recruitment.py:_new_invitation_v2_package"]
    notes: >-
      Private invitation wrapper for an inviter without an HTTP URL. Both
      card_authority members bind the exact card signing payload and signed_by
      signature; their hashes cover both. The inviter persona signs every
      wrapper member except signed_by and package_hash; package_hash covers
      the signed wrapper. First receipt independently verifies the exact source
      card and current local target visibility. No route, URL, token or private
      key is carried. HTTP invitation/1 remains supported and produced; response
      and membership /1 retain the original target card hash for a /2 invitation.

  - id: personaos-native-peer-federation/1
    class: open
    class_decided_by: "09_PROTOCOLS.md §4"
    status: current
    tiers: [in_process]
    owner: "09_PROTOCOLS.md §4"
    members:
      required: [operation, peer_id, multiaddrs, host_kernel_id, timeout_ms, body_json]
      optional: []
    emitters: ["src/personaos/protocols/peer_federation.py:exchange_peer_federation"]
    notes: >-
      Private trusted-helper stdin descriptor for the six fixed communication,
      admission, receipt and recruitment invitation/response/membership
      operations. body_json preserves exact authored JSON numeric spellings
      and Unicode through JavaScript. The verified route has 1 to 64 addresses,
      each at most 2048 characters and ending in its exact peer id; timeout_ms
      is a positive integer at most 4294967295. No optional or null members,
      bearer token, caller-supplied forwarding URL or new authority is emitted.

  - id: personaos-private-federation-frame/1
    class: open
    class_decided_by: "09_PROTOCOLS.md §4"
    status: current
    tiers: [in_process]
    owner: "09_PROTOCOLS.md §4"
    members:
      required: []
      optional: [id, action, host_kernel_id, operation, body_hash, body_size,
        timeout_ms, offset, length, state, next_offset, response_hash,
        response_size, status, error]
    emitters: ["tools/libp2p/private_federation.js:installPrivateFederationProtocol",
      "tools/libp2p/private_federation.js:exchangePrivateFederation"]
    notes: >-
      Union of emitted private peer wire headers; schema is the only member
      common to every variant and none emits null. Requests require id (48 lower
      hex), action, host_kernel_id, operation, body_hash and body_size; begin
      adds timeout_ms, put adds offset and binary bytes, read adds offset and
      length, and status/commit/release use the common request fields. Ordinary
      session replies require id, host_kernel_id, operation, body_hash, body_size,
      state and next_offset; complete adds response_hash, response_size and
      HTTP status, failed adds error, and read additionally returns offset and
      binary bytes. Busy/missing replies contain only schema/id/state; protocol
      errors contain only schema/state/error. A 4-byte big-endian header length
      precedes at most 8192 JSON header bytes and 65536 binary bytes. Sessions
      bind the actual Noise peer, exact immutable operation and full body hash;
      framing supplies no public-cache, application-event or execution authority.
      The server rejects request keys outside the protocol allowlist. The client
      verifies required response bindings and payload integrity without rejecting
      every unknown response member; exact application bodies retain their own
      independent signature and shape verification.

  - id: personaos-federated-persona-invitation-verification/1
    class: exact
    class_decided_by: "09_PROTOCOLS.md §4"
    status: current
    tiers: [lineage]
    owner: "09_PROTOCOLS.md §4"
