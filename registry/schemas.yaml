      directory commit. Recovery after commit reuses these exact local records
      without source contact or duplicate environment events. Startup recovery
      precedes ordinary topology replay; a refused imported destination cannot
      fall through into ordinary environment adoption.

  - id: personaos-environment-transfer/1
