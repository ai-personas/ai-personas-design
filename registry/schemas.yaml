      recipient_kernel_id, source_environment_id, source_environment_kernel_id,
      dispatch_environment_id, dispatch_task_id, package, package_hash,
      record_event_id and record_event_kind. direction is received or sent.
      package is null and package_hash is empty for a verified durable reply
      or direct source that has no outbox package yet; an unrouted direct source
      also has an empty recipient_kernel_id. Member replies retain their verified
      host as source_environment_kernel_id. Direct messages and replies instead
      retain each author's actual environment and source kernel. Both authority
      schemas require their exact owner, recipient and source bindings. Reads
      preserve signed source evidence, create no authored event or carriage
      observation, and clear the correspondence list on authority refusal.
      Owner correspondence revisions are independent of public invalidation;
      these private bodies confer no anonymous disclosure authority.

