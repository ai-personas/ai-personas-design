# registry/schemas.yaml — the registry of record for schema ids
# (14_DECISIONS.md ADR-0114 dec 1). One row per id; 09_PROTOCOLS.md §13.5
# (from S2) renders from this file, and the code repository vendors the
# generated tables with this registry's hash.
#
# Row shape
#   id                the schema id, `<name>/<integer>`
#   class             exact | open | rendered — one reader policy each
#                     (ADR-0114 dec 2)
#   class_decided_by  `seed` until the adversarial review of the first stage
#                     that generates a reader from the row decides it; the
#                     seed count never grows after S2
#   tiers             the surfaces the record rides:
#                     public_anonymous | operator | prompt | lineage
#   owner             the 00–12 section that defines the record, an ADR
#                     decision until that section is written, or `registry`
#   members           name → {type, required, item | key/value | members,
#                     tiers?, empty_when?, is?}; types are rows of
#                     registry/types.yaml; `empty_when` names the one
#                     condition under which a required member is the empty
#                     string (`available`, `unrecorded`);
#                     `schema` (schema_id) is a member of every row and is
#                     not repeated
#   notes             what the row must say that its members do not
#
# S0 seeds exactly the five rows the first stage touches; S2 re-seeds the
# remaining ids around them.
registry: schemas
owner: registry
rows:
  - id: personaos-public-project-topology/1
    class: rendered
    class_decided_by: seed
    tiers: [public_anonymous]
    owner: "04_PROJECT.md §10"
    members:
      project_id: {type: bounded_id, required: true}
      environment_ids: {type: list, item: bounded_id, required: true}
      primary_environment_id: {type: bounded_id, required: true}
      members: {type: map, key: bounded_id, value: text, required: true, is: "persona id → role"}
      project_creation_event_id: {type: bounded_id, required: true, is: "an `event:` id, or empty when not recorded"}
      environment_creation_event_id: {type: bounded_id, required: true, is: "an `event:` id, or empty when not recorded"}
      hosting_link_event_id: {type: bounded_id, required: true, is: "an `event:` id, or empty when not recorded"}
      cross_verified: {type: bool, required: true}
    notes: >-
      Carried on the project discovery document beside
      `project_topology_signature_hex` (signature_hex over this record).
      There is no `status` member.

  - id: personaos-project-export/3
    class: rendered
    class_decided_by: seed
    tiers: [public_anonymous, operator]
    owner: "04_PROJECT.md §10"
    members:
      project_id: {type: bounded_id, required: true}
      name: {type: text, required: true}
      created_by: {type: bounded_id, required: true}
      environments: {type: list, item: bounded_id, required: true}
      primary_environment_id: {type: bounded_id, required: true}
      domain_refs: {type: list, item: bounded_id, required: true}
      visibility_tier: {type: text, required: true}
      members: {type: map, key: bounded_id, value: text, required: true, is: "persona id → role"}
      bundle_id: {type: bounded_id, required: false}
      current_bundle_id: {type: bounded_id, required: false}
      artifact_manifest: {type: text, required: false}
    notes: >-
      The anonymous projection carries the required members only; the three
      optional members ride the deep export when a bundle exists.

  - id: personaos-persona-thinking/3
    class: rendered
    class_decided_by: seed
    tiers: [operator]
    owner: "ADR-0116 dec 2"
    members:
      generated_at: {type: iso_instant, required: true}
      persona_id: {type: bounded_id, required: true}
      name: {type: text, required: true}
      lifecycle_state: {type: text, required: true}
      brain_fragment_count: {type: integer, required: true}
      brain_fragment_binding_count: {type: integer, required: true}
      brain_evolution_decision_count: {type: integer, required: true}
      brain_evolution_application_count: {type: integer, required: true}
      brain_episode_count: {type: integer, required: true}
      proven_facts: {type: list, item: text, required: true}
